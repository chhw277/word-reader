<style>
:root {
  color-scheme: light;
  --bg: #F3F5F7;
  --page: #FFFFFF;
  --ink: #1B2430;
  --ink-2: #5A6675;
  --ink-3: #8A95A3;
  --line: #E3E7EC;
  --line-2: #D2D8DF;
  --field: #F6F8FA;
  --accent: #23606A;
  --accent-ink: #FFFFFF;
  --marker: #FFE45C;
  --marker-soft: rgba(255, 228, 92, .55);
  --ok: #2F7D57; --ok-bg: #E3F2EA;
  --bad: #B23A3A; --bad-bg: #FBEAEA;
  --shadow: 0 1px 2px rgba(27,36,48,.05), 0 8px 28px rgba(27,36,48,.06);
  --serif: "Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  --sans: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --drawer: 360px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15191F;
  --page: #1C2128;
  --ink: #E2E6EB;
  --ink-2: #A3ADB9;
  --ink-3: #78828F;
  --line: #2A313A;
  --line-2: #38414C;
  --field: #232932;
  --accent: #7CC4CC;
  --accent-ink: #10181B;
  --marker: #C9A92A;
  --marker-soft: rgba(201, 169, 42, .30);
  --ok: #6FC496; --ok-bg: #1D3329;
  --bad: #F08A8A; --bad-bg: #3A2224;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  height: 56px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.top.scrolled { border-bottom-color: var(--line); }
.brand { font: 600 17px/1 var(--serif); letter-spacing: .01em; margin-right: 4px; white-space: nowrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; }
.brand .logo { width: 22px; height: 22px; flex: none; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; min-width: 36px; padding: 0 10px;
  background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--ink-2);
}
.iconbtn:hover { background: var(--page); border-color: var(--line); color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn .lbl { font-size: 14px; }
.top .spacer { flex: 1; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; height: 30px; padding: 0 12px; border-radius: 999px;
  background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 13px;
}
.tabs button:hover { color: var(--ink); border-color: var(--ink-3); }
.tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
.tabs .tabnote { flex: none; font-size: 13px; color: var(--ink-3); align-self: center; padding: 0 6px; white-space: nowrap; }
.tabs button.retry { border-color: var(--bad); color: var(--bad); }

/* ---------- drawer ---------- */
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 40;
  width: var(--drawer); max-width: 92vw;
  background: var(--page); border-right: 1px solid var(--line);
  box-shadow: var(--shadow);
  transform: translateX(-100%); transition: transform .28s cubic-bezier(.3,.7,.2,1), visibility 0s .28s;
  visibility: hidden;
  display: flex; flex-direction: column;
}
body.open .drawer { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.3,.7,.2,1); }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(15,20,26,.28); opacity: 0; pointer-events: none; transition: opacity .25s; }
body.open .scrim { opacity: 1; pointer-events: auto; }
@media (min-width: 1180px) {
  /* Wide screens: the drawer docks beside the page instead of covering it. */
  body.open .scrim { opacity: 0; pointer-events: none; }
  body.open .shell { padding-left: var(--drawer); }
  body.open .top { padding-left: calc(var(--drawer) + 20px); }
  .drawer { box-shadow: none; }
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px 22px; }
.drawer-head h2 { font: 600 15px/1 var(--sans); margin: 0; color: var(--ink); }
.drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 22px 28px; display: flex; flex-direction: column; gap: 18px; }
.drawer-body > * { flex-shrink: 0; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .labrow label { font-size: 13px; color: var(--ink-2); }
.labrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.drawer textarea, .drawer input, .drawer select {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; color: var(--ink);
}
.drawer textarea:focus, .drawer input:focus, .drawer select:focus { border-color: var(--accent); outline: none; background: var(--page); }
.drawer textarea { min-height: 150px; resize: vertical; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.drawer textarea::placeholder, .drawer input::placeholder { color: var(--ink-3); }
.drawer textarea.drag { border-color: var(--accent); border-style: dashed; background: color-mix(in srgb, var(--accent) 7%, var(--field)); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.count { font-size: 12.5px; color: var(--ink-3); }
.count b { color: var(--ink); font-weight: 650; }
#importMsg.bad { color: var(--bad); }

.import {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 14px; border: 1px dashed var(--line-2); border-radius: 10px;
  background: transparent; text-align: left; color: var(--ink);
}
.import:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
.import svg { width: 26px; height: 26px; flex: none; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.import b { display: block; font-weight: 600; font-size: 14.5px; }
.import span { display: block; font-size: 12.5px; color: var(--ink-3); }

.primary {
  height: 44px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-weight: 650; font-size: 15px;
}
.primary:hover { filter: brightness(1.08); }
.primary:disabled { opacity: .55; cursor: progress; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12.5px; }
.link:hover { text-decoration: underline; }

details.sec { border-top: 1px solid var(--line); padding-top: 14px; }
details.sec summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); list-style: none; display: flex; align-items: center; gap: 8px; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::after { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--ink-3); border-bottom: 1.6px solid var(--ink-3); transform: rotate(-45deg); margin: 0 4px 0 auto; transition: transform .2s; }
details.sec[open] summary::after { transform: rotate(45deg); }
details.sec summary .state { font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
details.sec summary .state.ok { color: var(--ok); }
details.sec .inner { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.hint { font-size: 12px; color: var(--ink-3); margin: 0; line-height: 1.5; }

.history ul { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.history li { display: flex; align-items: center; }
.history li button.open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 7px; }
.history li button.open:hover { background: var(--field); }
.history li button.open[aria-current="true"] { background: var(--field); box-shadow: inset 2px 0 0 var(--accent); }
.history li .d { display: block; font-size: 11.5px; color: var(--ink-3); }
.history li .t { display: block; font: 14px/1.35 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history li button.del { background: none; border: 0; color: var(--ink-3); padding: 4px 8px; font-size: 16px; opacity: 0; }
.history li:hover button.del, .history li button.del:focus-visible { opacity: 1; }
.history li button.del:hover { color: var(--bad); }
.history .empty { font-size: 13px; color: var(--ink-3); padding: 4px 0; }

/* ---------- reading page ---------- */
.shell { transition: padding-left .28s cubic-bezier(.3,.7,.2,1); }
.stage { padding: 24px 20px 96px; }
.sheet {
  max-width: 760px; margin: 0 auto;
  background: var(--page); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 56px 72px 64px; min-height: 72vh;
}
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -28px -44px 36px; }
.toolbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink-2); font-size: 13px;
}
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--field); border-color: var(--line-2); color: var(--ink); }
.chip svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

article h1 { font: 650 38px/1.15 var(--serif); margin: 0 0 12px; letter-spacing: -.012em; text-wrap: balance; }
.meta { color: var(--ink-3); font-size: 13.5px; margin: 0 0 36px; }
.meta b { color: var(--ink-2); font-weight: 500; }

/* Review words: the page's teal accent instead of yellow, so old and new words read differently. */

mark.w.rv:hover, mark.w.rv.on { background: color-mix(in srgb, var(--accent) 24%, transparent); }
.rv-tag { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 4px; font: 600 12px/1.6 var(--sans); vertical-align: 2px;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rv-note { color: var(--accent); }
.rv-key { padding: 0 3px; margin: 0 1px; background: color-mix(in srgb, var(--accent) 13%, transparent); box-shadow: inset 0 -2px 0 var(--accent); }

.ph { text-decoration: underline dashed var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }

/* ---------- companion ---------- */
.buddy {
  display: flex; align-items: center; gap: 22px;
  /* Card uses the page's own ink colour so it sits in the existing palette. */
  background: var(--ink); color: var(--page);
  background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.2px);
  background-size: 14px 14px;
  border-radius: 14px; padding: 18px 22px; overflow: hidden;
}
:root[data-theme="dark"] .buddy { background-color: var(--field); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.buddy .face {
  flex: none; width: 112px; height: 112px; border-radius: 50%; overflow: hidden;
  background: #3A312A; box-shadow: 0 0 0 3px color-mix(in srgb, var(--page) 18%, transparent);
  animation: breathe 5s ease-in-out infinite;
}
.buddy .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
@keyframes breathe { 50% { transform: translateY(-2px) scale(1.015); } }
.buddy .say { flex: 1; min-width: 0; }
.buddy .say p { margin: 0; font: 16px/1.65 var(--sans); }
.buddy .say small { display: block; margin-top: 4px; opacity: .7; font-size: 13px; }
.wave { display: flex; align-items: center; gap: 6px; height: 54px; margin-top: 12px; }
.wave i {
  display: block; width: 9px; height: 100%; background: currentColor; opacity: .9;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  transform: scaleY(.35); transform-origin: center;
}
.wave i:nth-last-child(-n+2) { background: var(--marker); opacity: 1; }
.wave.idle i { animation: drift 4.8s ease-in-out infinite; }
.wave.idle i:nth-child(odd) { animation-delay: -2.4s; }
.wave.idle i:nth-child(3n) { animation-delay: -1.2s; }
@keyframes drift { 0%, 100% { transform: scaleY(.28); } 50% { transform: scaleY(.55); } }
.wave.live i { animation: pulse 1.6s ease-in-out infinite; }
.wave.live i:nth-child(1)  { animation-delay: -.0s; }
.wave.live i:nth-child(2)  { animation-delay: -.9s; }
.wave.live i:nth-child(3)  { animation-delay: -.3s; }
.wave.live i:nth-child(4)  { animation-delay: -1.2s; }
.wave.live i:nth-child(5)  { animation-delay: -.6s; }
.wave.live i:nth-child(6)  { animation-delay: -1.4s; }
.wave.live i:nth-child(7)  { animation-delay: -.2s; }
.wave.live i:nth-child(8)  { animation-delay: -1.0s; }
.wave.live i:nth-child(9)  { animation-delay: -.5s; }
.wave.live i:nth-child(10) { animation-delay: -1.3s; }
.wave.live i:nth-child(11) { animation-delay: -.8s; }
.wave.live i:nth-child(12) { animation-delay: -.1s; }
.wave.live i:nth-child(13) { animation-delay: -1.1s; }
@keyframes pulse { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
.intro .buddy { margin-bottom: 32px; }
.loading .buddy { margin-bottom: 4px; }
.buddy.cheer { margin-top: 18px; padding: 14px 18px; gap: 16px; }
.buddy.cheer .face { width: 64px; height: 64px; }
@media (max-width: 760px) {
  .buddy { gap: 14px; padding: 14px 16px; }
  .buddy .face { width: 76px; height: 76px; }
  .buddy .say p { font-size: 15px; }
  .wave { height: 40px; gap: 4px; }
  .wave i { width: 7px; }
}
.short-only { }
body.mode-nights .short-only { display: none; }
.part-break { text-align: center; color: var(--ink-3); letter-spacing: .4em; margin: 6px 0 22px; font-size: 14px; }
.rd-tag { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 4px; font: 600 12px/1.6 var(--sans); vertical-align: 2px;
  color: var(--ink-2); background: var(--field); border: 1px solid var(--line); }
.q .opts.opts-col { grid-template-columns: 1fr; }

.missing { font-size: 13px; color: var(--bad); margin: -22px 0 28px; }

.pop {

}
@keyframes popin { from { opacity: 0; transform: translateY(4px); } }

.pop .pos { opacity: .7; font-size: 13px; margin-left: 6px; }
.pop .mean { margin-top: 6px; }

section.block { margin-top: 52px; padding-top: 28px; border-top: 1px solid var(--line); }
section.block h2 { font: 650 21px/1.3 var(--serif); margin: 0 0 18px; }

.gloss .hw { font: 600 17px var(--serif); }
.gloss .pos { color: var(--ink-3); font-size: 13px; font-style: italic; }

.q { margin-bottom: 26px; }
.q .stem { font: 17.5px/1.6 var(--serif); margin: 0 0 12px; }
.q .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.q .opts button {

}

}

.quick {

.loading { font: 19px/1.7 var(--serif); color: var(--ink-2); padding-top: 12px; }

.loading .bar i { display: block; height: 100%; width: 35%; background: var(--marker); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

.error pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; opacity: .8; max-height: 160px; overflow: auto; }

@media (max-width: 760px) {

(() => {
"use strict";

/* ---------------- storage ---------------- */
function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const settingIds = ["level", "genre", "length", "per", "maxArticles", "topic", "provider", "baseUrl", "model", "apiKey"];
function restoreSettings() {
  const s = load(LS_SET, {});
  if (!s.provider) { s.provider = "deepseek"; Object.assign(s, PRESETS.deepseek); }
  // DeepSeek retired these names on 2026-07-24; requests with them now fail.
  if (/^deepseek-(chat|reasoner)$/.test(s.model || "")) { s.model = PRESETS.deepseek.model; save(LS_SET, s); }
  // One-time move to the lighter default (8 words per article); the old default of 12 made
  // articles too dense once each word had to appear twice.
  if (!s.densityV2) { if (+s.per > 8) s.per = "8"; s.densityV2 = true; save(LS_SET, s); }
  for (const id of settingIds) if (s[id] != null) $(id).value = s[id];
  $("settingsBox").open = !s.apiKey;
}
function persistSettings() {
  const s = {};
  for (const id of settingIds) s[id] = $(id).value;
  s.densityV2 = true;
  save(LS_SET, s);
  updateKeyState();
}
function updateKeyState() {
  const has = !!$("apiKey").value.trim();
  $("keyState").textContent = has ? "已保存" : "还没填 Key";
  $("keyState").className = `state${has ? " ok" : ""}`;
}

// Accepts lines like "abandon v. 放弃", "abandon\t放弃", "take over 接管", "1. abandon /əˈbændən/ 放弃"
function parseWords(text) {
  const out = [];
  const seen = new Set();
  for (let line of text.split(/\r?\n/)) {
    line = line.trim().replace(/^\d+[.、)\s]+/, "");
    if (!line) continue;
    const m = line.match(/^([A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*)*)(.*)$/);
    if (!m) continue;
    let word = m[1].trim();
    let rest = m[2].replace(/\/[^/]*\//g, " ").replace(/\[[^\]]*\]/g, " ").trim();
    // If the English run swallowed a part-of-speech tag (e.g. "abandon v"), split it back off.
    const pos = word.match(/^(.*?)\s+(n|v|vt|vi|vlink|aux|modal|adj|adv|prep|conj|pron|int|interj|num|art|abbr|pl|phr)$/i);
    if (pos && rest.startsWith(".")) { word = pos[1]; rest = pos[2] + rest; }
    const key = word.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({ word, meaning: rest.replace(/^[\s:：\-—|,，]+/, "") });
  }
  return out;
}

// The export embeds Source Han Sans with Kangxi/CJK-radical code points (⽇, ⻓ …). NFKC fixes the
// Kangxi block; the CJK Radicals Supplement block has no decomposition, so map the common ones.
const RADICALS = { "⺠": "民", "⻆": "角", "⻓": "长", "⻚": "页", "⻛": "风", "⻢": "马", "⻣": "骨",
  "⻅": "见", "⻋": "车", "⻔": "门", "⻝": "食", "⻠": "饣", "⻜": "飞", "⻨": "麦", "⻩": "黄", "⻬": "齐",
  "⻰": "龙", "⻳": "龟", "⻘": "青", "⻙": "韦", "⻦": "鸟", "⻥": "鱼", "⻉": "贝", "⻊": "足", "⻌": "辶" };
const fixCJK = (s) => s
  .replace(/[⼀-⿟]/g, (c) => c.normalize("NFKC"))
  .replace(/[⺀-⻿]/g, (c) => RADICALS[c] || c);

const PDFJS_SRC = [
  "https://cdn.staticfile.net/pdf.js/3.11.174/",
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/",
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/",
];
let pdfjsReady = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = (async () => {
    for (const base of PDFJS_SRC) {
      try {
        await new Promise((ok, fail) => {
          const s = document.createElement("script");
          s.src = base + "pdf.min.js"; s.onload = ok; s.onerror = fail;
          document.head.append(s);
        });
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
          return window.pdfjsLib;
        }
      } catch {}
    }
    pdfjsReady = null;
    throw new UserError("读取 PDF 需要联网加载解析组件，但没能加载成功。检查网络后再试，或者手动复制单词粘贴进来。");
  })();
  return pdfjsReady;
}

// Group text items that share a baseline into lines.
function toLines(items) {
  const sorted = items.slice().sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const it of sorted) {
    const last = lines[lines.length - 1];
    if (last && Math.abs(last.y - it.y) < 2.5) last.parts.push(it);
    else lines.push({ y: it.y, parts: [it] });
  }
  return lines.map((l) => {
    l.parts.sort((a, b) => a.x - b.x);
    return { y: l.y, x: l.parts[0].x, text: l.parts.map((p) => p.str).join(" ").replace(/\s+/g, " ")
      .replace(/([(（])\s+/g, "$1").trim() };
  });
}

// Generic word list: one word per visual line, e.g. "12  facility  n.  设施；便利" or
// "abandon v. 放弃". Lines are rebuilt from text positions, then each line is split into
// optional index, English headword, optional part of speech, and the meaning.
const POS_RE = /^(?:n|v|vt|vi|adj|adv|prep|conj|pron|int|interj|num|art|aux|modal|abbr|pl|phr|vlink)\.?(?:\s*[\/&,]\s*(?:n|v|vt|vi|adj|adv|prep|conj|pron|num)\.?)*$/i;
function parseGenericLines(lines) {
  const out = [];
  let last = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^(?:\d+[.、)]?\s+)?([A-Za-z][A-Za-z'’\-]*(?:\s[A-Za-z][A-Za-z'’\-]*){0,3})\s+(.+)$/);
    if (m) {
      let word = m[1], rest = m[2].trim();
      // A multi-word headword may have swallowed the part of speech: "take over v. 接管".
      const parts = word.split(" ");
      if (parts.length > 1 && POS_RE.test(parts[parts.length - 1])) { rest = parts.pop() + " " + rest; word = parts.join(" "); }
      // Need some Chinese, or a part of speech, to count as a word row (skips titles like "CET-4 Vocabulary").
      if (/[一-鿿]/.test(rest) || POS_RE.test(rest.split(/\s+/)[0])) {
        last = { word, meaning: rest.replace(/\s{2,}/g, " ") };
        out.push(last);
        continue;
      }
    }
    // A Chinese-only line right under a word row continues its meaning.
    if (last && /^[一-鿿（(]/.test(line) && !/^(序号|单词|词性|释义)/.test(line)) last.meaning += "；" + line;
    else last = null;
  }
  // Drop header-ish rows and duplicates.
  const seen = new Set();
  return out.filter((w) => {
    const k = w.word.toLowerCase();
    if (/^(word|words|meaning|vocabulary|no)$/i.test(w.word) || seen.has(k)) return false;
    seen.add(k); return true;
  });
}

async function readPdfPages(file) {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    pages.push({
      page,
      width: page.view[2] - page.view[0],
      items: tc.items.filter((i) => i.str && i.str.trim())
        .map((i) => ({ str: fixCJK(i.str), x: i.transform[4], y: i.transform[5] })),
    });
  }
  return pages;
}

const AI_MAX_WORDS = 40;

function aiExtractPrompt(kind) {
  return `The learner (a Chinese student preparing for 四六级/考研) uploaded a document ${kind}. Extract English vocabulary to study.

- If it is a WORD LIST (words with meanings, any layout): return every English headword in order, with its Chinese meaning as written (include part of speech if shown). Do not invent or skip entries.
- If it is ordinary English TEXT (article, textbook, exam passage): pick up to ${AI_MAX_WORDS} words or short phrases worth studying at 四六级/考研 level. Skip very common words (the, make, good, people) and proper nouns. Use the base form (mitigates -> mitigate). Give a concise Chinese meaning that fits how it is used in the text, with part of speech.

Reply with JSON only: {"type": "wordlist" or "text", "words": [{"word": "mitigate", "meaning": "v. 减轻，缓和"}]}`;
}

async function pageImages(pages) {
  const out = [];
  for (const { page } of pages.slice(0, AI_MAX_PAGES)) {
    const vp1 = page.getViewport({ scale: 1 });
    const scale = Math.min(2, 1400 / Math.max(vp1.width, vp1.height));   // ~1300px long side is what the model uses
    const vp = page.getViewport({ scale });
    const cv = document.createElement("canvas");
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(cv.toDataURL("image/jpeg", 0.85));
  }
  return out;
}

// Words too basic to be worth a slot, in case the model picks them from an article anyway.
const COMMON = new Set(("the a an and or but if of to in on at by for with from as is are was were be been being have has had do does did " +
  "this that these those it its they them their he she his her we our you your i me my not no yes so very " +
  "make good people time year day way thing man woman child world life hand part place work week say get go know take see come think look want give use find tell").split(" "));

function parseAiWords(text) {
  const t = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  let obj = null;
  try { obj = JSON.parse(t.slice(a, b + 1)); } catch {}
  const seen = new Set();
  const words = (obj?.words || [])
    .map((w) => ({ word: String(w.word || "").trim(), meaning: String(w.meaning || "").trim() }))
    .filter((w) => /^[A-Za-z][A-Za-z'’\- ]{0,40}$/.test(w.word))
    .filter((w) => !COMMON.has(w.word.toLowerCase()))
    .filter((w) => { const k = w.word.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  return { words, type: obj?.type === "text" ? "text" : "wordlist" };
}

async function aiReadPdf(pages, onStatus) {
  const text = pages.map((pg) => toLines(pg.items).map((l) => l.text).join("\n")).join("\n\n").trim();
  const englishChars = (text.match(/[A-Za-z]/g) || []).length;
  let reply, via;
  if (englishChars >= 80) {
    onStatus("正在让 AI 从 PDF 文字里挑单词…");
    via = "text";
    reply = await callModel(`${aiExtractPrompt("whose text is below")}\n\nPDF text:\n${text.slice(0, AI_MAX_CHARS)}`);
  } else {
    if (!visionCapable()) throw new UserError("这个 PDF 是扫描件或图片，需要能看图的模型才能识别。当前模型不支持看图：DeepSeek 用 deepseek-flash，Claude 和 OpenAI 的模型一般都可以。");
    onStatus(`这是扫描件，正在让 AI 看图识别（${Math.min(pages.length, AI_MAX_PAGES)} 页）…`);
    via = "image";
    reply = await callModel(aiExtractPrompt("as page images"), await pageImages(pages));
  }
  return { ...parseAiWords(reply), via, truncated: via === "image" ? pages.length > AI_MAX_PAGES : text.length > AI_MAX_CHARS };
}
function visionCapable() {
  const m = $("model").value.trim().toLowerCase();
  if ($("provider").value === "deepseek") return m === "deepseek-flash" || m.includes("vision");
  if ($("provider").value === "qwen") return /vl|omni|qwen3\.\d|qwen-plus/.test(m);
  return true;
}

// A local parse is trusted when it found a real list; a handful of hits from an article usually
// means the line parser matched sentences, so hand those to the AI instead.
function localLooksGood(r, pages) {
  if (r.format === "bbdc") return r.words.length > 0;
  const lines = pages.reduce((n, pg) => n + toLines(pg.items).length, 0);
  return r.words.length >= 5 && r.words.length >= lines * 0.35;
}
function linesLookGood(words, lines) {
  const n = lines.filter((l) => l.trim()).length;
  return words.length >= 5 && words.length >= n * 0.35;
}

/* ---------------- other document formats ----------------
   Each reader turns a file into plain text lines (Word, TXT, CSV, Excel) or images (photos,
   screenshots). Lines go through the same word-list parser as PDFs; if that doesn't find a
   list, the text goes to the AI, which also handles articles and textbooks. */
function loadScript(urls, globalName, label) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  loadScript.cache = loadScript.cache || {};
  if (loadScript.cache[globalName]) return loadScript.cache[globalName];
  return (loadScript.cache[globalName] = (async () => {
    for (const u of urls) {
      try {
        await new Promise((ok, fail) => { const s = document.createElement("script"); s.src = u; s.onload = ok; s.onerror = fail; document.head.append(s); });
        if (window[globalName]) return window[globalName];
      } catch {}
    }
    loadScript.cache[globalName] = null;
    throw new UserError(`读取${label}需要联网加载解析组件，但没能加载成功。检查网络后再试，或者手动复制单词粘贴进来。`);
  })());
}
const loadMammoth = () => loadScript([
  "https://cdn.staticfile.net/mammoth/1.8.0/mammoth.browser.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js",
  "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"], "mammoth", " Word 文档");
const loadXlsx = () => loadScript([
  "https://cdn.staticfile.net/xlsx/0.18.5/xlsx.full.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"], "XLSX", " Excel 表格");

const FILE_KINDS = [
  { kind: "pdf",   label: "PDF",        re: /\.pdf$/i,               mime: /pdf/ },
  { kind: "docx",  label: "Word 文档",  re: /\.docx$/i,              mime: /wordprocessingml/ },
  { kind: "sheet", label: "表格",       re: /\.(xlsx|xls|csv|tsv)$/i, mime: /spreadsheet|ms-excel|csv|tab-separated/ },
  { kind: "text",  label: "文本文件",   re: /\.(txt|text|md)$/i,     mime: /^text\/plain/ },
  { kind: "image", label: "图片",       re: /\.(jpe?g|png|webp|gif)$/i, mime: /^image\/(jpeg|png|webp|gif)/ },
];
const ACCEPT = ".pdf,.docx,.txt,.md,.csv,.tsv,.xlsx,.xls,.jpg,.jpeg,.png,.webp,.gif";
const kindOf = (f) => FILE_KINDS.find((k) => k.re.test(f.name) || k.mime.test(f.type || ""));

function decodeText(buf) {
  // Chinese Windows tools often save TXT/CSV as GBK; fall back to it when UTF-8 shows replacement chars.
  const utf8 = new TextDecoder("utf-8").decode(buf);
  if (!utf8.includes("�")) return utf8.replace(/^﻿/, "");
  try { return new TextDecoder("gbk").decode(buf); } catch { return utf8; }
}

async function readAsLines(file, kind) {
  if (kind === "text") return decodeText(await file.arrayBuffer()).split(/\r?\n/);
  if (kind === "docx") {
    const mammoth = await loadMammoth();
    // HTML keeps table cells separate, so a Word table becomes one row per line.
    const { value } = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    const doc = new DOMParser().parseFromString(value, "text/html");
    const lines = [];
    doc.body.querySelectorAll("tr, p, li, h1, h2, h3, h4").forEach((el) => {
      if (el.closest("tr") && el.tagName !== "TR") return;
      const t = el.tagName === "TR"
        ? [...el.children].map((c) => c.textContent.trim()).filter(Boolean).join("  ")
        : el.textContent.trim();
      if (t) lines.push(t);
    });
    return lines;
  }
  if (kind === "sheet") {
    if (/\.(csv|tsv)$/i.test(file.name)) {
      const sep = /\.tsv$/i.test(file.name) ? "\t" : ",";
      return decodeText(await file.arrayBuffer()).split(/\r?\n/)
        .map((l) => l.split(sep).map((c) => c.replace(/^"|"$/g, "").trim()).filter(Boolean).join("  "));
    }
    const XLSX = await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    return wb.SheetNames.flatMap((n) => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, blankrows: false })
      .map((row) => row.map((c) => String(c ?? "").trim()).filter(Boolean).join("  ")));
  }
  return [];
}

async function fileToDataUrl(file) {
  // Re-encode as JPEG and cap the size: phone photos are often 4000px+ and several MB.
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * scale); cv.height = Math.round(img.naturalHeight * scale);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", 0.88);
  } catch { throw new UserError("这张图片打不开，换一张 JPG 或 PNG 试试。"); }
  finally { URL.revokeObjectURL(url); }
}

function needKey(label) {
  if ($("apiKey").value.trim()) return;
  throw new UserError(`这个${label}需要 AI 帮忙识别。先在「API 设置」里填好 Key 再导入。`);
}

async function aiFromText(text, label, onStatus) {
  needKey(label);
  onStatus(`正在让 AI 从${label}里挑单词…`);
  const reply = await callModel(`${aiExtractPrompt("whose text is below")}\n\nText:\n${text.slice(0, AI_MAX_CHARS)}`);
  return { ...parseAiWords(reply), via: "text", truncated: text.length > AI_MAX_CHARS };
}

async function parseWordFile(file, onStatus = () => {}) {
  const k = kindOf(file);
  if (!k) throw new UserError(`不支持这种文件：${file.name}。可以用 PDF、Word（.docx）、TXT、Excel、CSV，或者 JPG / PNG 图片。`);
  if (k.kind === "pdf") return parseWordPdf(file, onStatus);
  if (k.kind === "image") {
    needKey("图片");
    if (!visionCapable()) throw new UserError("识别图片需要能看图的模型。DeepSeek 用 deepseek-flash，Claude 和 OpenAI 的模型一般都可以。");
    onStatus("正在让 AI 看图识别…");
    const ai = parseAiWords(await callModel(aiExtractPrompt("as an image (photo or screenshot)"), [await fileToDataUrl(file)]));
    return { words: ai.words, total: null, format: "ai", aiType: ai.type, via: "image", truncated: false };
  }
  const lines = await readAsLines(file, k.kind);
  const local = parseGenericLines(lines);
  if (linesLookGood(local, lines)) return { words: local, total: null, format: "generic" };
  const text = lines.join("\n").trim();
  if ((text.match(/[A-Za-z]/g) || []).length < 20) {
    if (local.length) return { words: local, total: null, format: "generic" };
    throw new UserError(`这个${k.label}里没有找到英文内容。`);
  }
  if (!$("apiKey").value.trim() && local.length) return { words: local, total: null, format: "generic" };
  const ai = await aiFromText(text, k.label, onStatus);
  if (!ai.words.length && local.length) return { words: local, total: null, format: "generic" };
  return { words: ai.words, total: null, format: "ai", aiType: ai.type, via: "text", truncated: ai.truncated };
}

async function parseWordPdf(file, onStatus = () => {}) {
  const pages = await readPdfPages(file);
  const isBbdc = pages.some((pg) => pg.items.some((i) => /^(Word|Meaning)$/.test(i.str.trim())))
    && pages.some((pg) => pg.items.some((i) => /共\s*\d+\s*词|近日已学|不背单词/.test(i.str)));
  let local = null;
  if (isBbdc) {
    const r = parseBbdcPages(pages);
    if (r.words.length) local = { ...r, format: "bbdc" };
  }
  if (!local) {
    const lines = pages.flatMap((pg) => toLines(pg.items).map((l) => l.text));
    local = { words: parseGenericLines(lines), total: null, format: "generic" };
  }
  if (localLooksGood(local, pages)) return local;
  if (!$("apiKey").value.trim()) {
    if (local.words.length) return local;
    throw new UserError("这个 PDF 不是常见的单词表格式，需要 AI 帮忙识别。先在「API 设置」里填好 Key 再导入。");
  }
  const ai = await aiReadPdf(pages, onStatus);
  if (!ai.words.length && local.words.length) return local;
  return { words: ai.words, total: null, format: "ai", aiType: ai.type, via: ai.via, truncated: ai.truncated };
}

function parseBbdcPages(pages) {
  const words = [];
  let total = null;
  for (const { width, items } of pages) {

    // Column positions come from the "Word / Meaning" header row; fall back to the A4 layout.
    const heads = items.filter((i) => /^(Word|Meaning)$/.test(i.str.trim()));
    const headY = heads.length ? Math.max(...heads.map((h) => h.y)) : Infinity;
    const meaningX = Math.max(...heads.filter((h) => h.str.trim() === "Meaning").map((h) => h.x), width * 0.62);
    const wordHeads = heads.filter((h) => h.str.trim() === "Word").map((h) => h.x);
    const wordX = wordHeads.length ? Math.min(...wordHeads) : width * 0.1;

    const body = [];
    for (const it of items) {
      const m = it.str.match(/共\s*(\d+)\s*词/);
      if (m) { total = +m[1]; continue; }
      if (it.y >= headY - 2) continue;              // header row and title area
      body.push(it);
    }
    const wordLines = toLines(body.filter((i) => i.x >= wordX - 6 && i.x < width * 0.45))
      .filter((l) => /^[A-Za-z][A-Za-z'’\-. ]*$/.test(l.text));
    const meanLines = toLines(body.filter((i) => i.x >= meaningX - 6))
      .filter((l) => !/共\s*\d+\s*词|\d+\s*\/\s*\d+\s*页/.test(l.text));

    // A word with several senses has a stack of meaning lines that can extend past the midpoint
    // to the next word, so cluster lines into blocks (tight line spacing) and match block centers.
    const blocks = [];
    for (const ml of meanLines) {          // already sorted top to bottom
      const b = blocks[blocks.length - 1];
      if (b && b.lastY - ml.y < 12) { b.lines.push(ml.text); b.lastY = ml.y; b.sum += ml.y; }
      else blocks.push({ lines: [ml.text], lastY: ml.y, sum: ml.y });
    }
    const rows = wordLines.map((l) => ({ word: l.text, y: l.y, means: [] }));
    for (const b of blocks) {
      const cy = b.sum / b.lines.length;
      let best = null, d = Infinity;
      for (const r of rows) { const dd = Math.abs(r.y - cy); if (dd < d) { d = dd; best = r; } }
      if (best) best.means.push(...b.lines);
    }
    for (const r of rows) words.push({ word: r.word, meaning: r.means.join(" | ") });
  }
  return { words, total };
}

// auto = true: the one-step daily flow. Picking a PDF goes straight to generating.
async function importPdf(file, auto = false) {
  const msg = $("importMsg");
  msg.hidden = false; msg.className = "count"; msg.textContent = `正在读取 ${file.name}…`;
  const status = (t) => {
    msg.textContent = t;
    // In the one-click flow the drawer is closed, so show progress on the page too.
    if (auto) $("sheet").innerHTML = `<div class="loading">${buddy(esc(t), "AI 识别通常需要 10 到 30 秒。", { wave: "live" })}</div>`;
  };
  try {
    const r = await parseWordFile(file, status);
    const { words, total } = r;
    if (!words.length) throw new UserError("这个文件里没有读到英文单词。可以换一份文件，或者手动把单词粘贴进来。");
    $("words").value = words.map((w) => `${w.word}  ${w.meaning}`).join("\n");
    updateCount();
    persistWords();
    const short = total && total !== words.length;
    if (short) {
      msg.className = "count bad";
      msg.textContent = `PDF 写的是 ${total} 词，只读出了 ${words.length} 个，请核对一下。`;
    } else if (r.format === "ai") {
      msg.innerHTML = r.aiType === "text"
        ? `AI 从文章里挑出了 <b>${words.length}</b> 个值得背的词，可以在下面删改`
        : `AI 识别出 <b>${words.length}</b> 个单词${r.via === "image" ? "（看图识别，建议核对一下）" : ""}`;
      if (r.truncated) msg.innerHTML += `。文件太长，只读了前 ${r.via === "image" ? AI_MAX_PAGES + " 页" : "一部分"}`;
    } else {
      msg.innerHTML = `已从 ${(kindOf(file) || { label: "文件" }).label} 导入 <b>${words.length}</b> 个单词`;
    }
    if (auto && !short) generate();
    else if (auto) setDrawer(true);
  } catch (e) {
    msg.className = "count bad";
    msg.textContent = e instanceof UserError ? e.message : `读取 PDF 失败：${e.message || e}`;
    if (auto) { setDrawer(true); renderError(e instanceof UserError ? e : new UserError(msg.textContent)); }
  }
}

function updateCount() {
  const list = parseWords($("words").value);
  document.body.classList.toggle("mode-nights", isNights($("genre").value));
  $("go").textContent = isNights($("genre").value) ? "写今晚的故事" : "生成短文";
  if (!list.length) { $("count").textContent = "还没有单词"; return; }
  document.body.classList.toggle("mode-nights", isNights($("genre").value));
  $("go").textContent = isNights($("genre").value) ? "写今晚的故事" : "生成短文";
  if (isNights($("genre").value)) {
    let p; try { p = planNight(list); } catch { p = null; }
    if (!p) { $("count").innerHTML = `识别到 <b>${list.length}</b> 个单词`; return; }
    const night = (typeof nights === "object" ? nights.count : 0) + 1;
    if (p.reviewNight) {
      $("count").innerHTML = p.groups.length
        ? `这些词都写进过故事了。第 ${night} 夜会用 <b>${p.pick.length}</b> 个该复习的词写一晚`
        : `这些词都写进过故事了，今天也没有该复习的词`;
      return;
    }
    $("count").innerHTML = `识别到 <b>${list.length}</b> 个单词。第 ${night} 夜用最新的 <b>${p.pick.length}</b> 个，分 ${p.groups.length} 段，共约 <b>${p.groups.length * 400}</b> 词`
      + (p.due.length ? `，另外混入 <b>${p.due.length}</b> 个复习词` : "")
      + (p.rest.length ? `。其余 ${p.rest.length} 个进入复习计划` : "");
    return;
  }
  let plan;
  try { plan = planToday(list); } catch { plan = null; }   // word bank not loaded yet on first paint
  if (!plan) { $("count").innerHTML = `识别到 <b>${list.length}</b> 个单词`; return; }
  const n = Math.max(1, plan.groups.length);
  const opts = { length: $("length").value, genre: $("genre").value };
  const rv = Math.max(0, Math.min(REVIEW_PER_ARTICLE, Math.ceil(plan.due.length / n) || 0));
  const len = targetLength(plan.groups[0] || [], opts, Array(rv).fill({}));
  if (!plan.pick.length) {
    $("count").innerHTML = `识别到 <b>${list.length}</b> 个单词，都已经写过文章了` + (plan.due.length ? `。点生成会写一篇复习文章，用到 <b>${plan.due.length}</b> 个该复习的词` : "，今天没有新词要写");
    return;
  }
  const head = plan.rest.length
    ? `识别到 <b>${list.length}</b> 个单词，今天先写最新的 <b>${plan.pick.length}</b> 个，共 <b>${n}</b> 篇，每篇约 <b>${len}</b> 词`
    : `识别到 <b>${list.length}</b> 个单词，将生成 <b>${n}</b> 篇短文，每篇约 <b>${len}</b> 词`;
  const tail = plan.rest.length ? `。其余 ${plan.rest.length} 个已加入复习计划，会按时混进之后的文章` : "";
  $("count").innerHTML = head + (plan.due.length ? `，另外混入 <b>${plan.due.length}</b> 个复习词` : "") + tail;
}
