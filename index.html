const isNights = (g) => g === "nights";

/* ---------------- prompt + API ---------------- */
// Genre-specific craft notes. Generic "write a story" prompts are what make cheaper models sound
// flat; telling them what good writing in that form looks like closes most of the gap.
const GENRE_CRAFT = {
  "a short story with characters and a plot":
    "One named character who wants something concrete and meets one obstacle. Show, don't summarize: a specific place, a few sensory details, one or two short lines of dialogue. End on a small, earned change or image, not a moral.",
  "a news report":
    "Inverted pyramid: the lede answers who/what/where/when in one sentence. Specific (invented) names, numbers, places and one attributed quote. Neutral tone, no opinions from the writer.",
  "a popular-science article":
    "Open with a concrete puzzle or observation, then explain the mechanism step by step with one vivid analogy. Mention one specific (invented but plausible) study or researcher. End with what is still unknown.",
  "an argumentative essay like an exam reading passage":
    "Like a passage from The Economist or a 考研 reading text: a clear thesis in the first paragraph, one opposing view fairly stated and answered, concrete examples rather than abstractions, and a measured conclusion.",
  "a natural dialogue between two people":
    "Two named speakers with different moods or goals. Short turns, contractions, interruptions, natural spoken phrases. Write each turn as \"Name: line\" and give each turn its own paragraph.",
  "a personal diary entry":
    "First person, past tense for events and present tense for feelings. One specific event of the day, small concrete details, honest feelings, a slightly informal voice.",
};

const STYLE_RULES = `Style rules (these matter as much as using the words):
- Each target word must do real work in its sentence and move the text forward. Bad: "The vessel was important." Good: "By noon the fishing vessel was still not back, and the harbour had gone quiet." Never write a sentence whose only job is to contain a word.
- Prefer concrete nouns and strong verbs. Vary sentence length; mix short sentences with longer ones.
- Never use empty filler that has no exam value: "delve", "tapestry", "a testament to", "embark on a journey", "navigate the complexities", "Little did she know".
- No moral or lesson spelled out at the end.
- Do not cram several target words into one sentence; spread them across the text.`;

// The learner also wants exam-writing value (四六级/考研作文), so useful set phrases are allowed
// in moderation and taught explicitly. How many depends on the genre.
// Fewer than before: with two uses per word plus review words, more phrases made texts read
// like a checklist. Essay-style genres get a couple; narrative genres get one.
const PHRASE_COUNT = {
  "an argumentative essay like an exam reading passage": "2",
  "a news report": "1 to 2",
  "a popular-science article": "1 to 2",
};
function phraseRule(opts) {
  const n = PHRASE_COUNT[opts.genre] || "1";
  return `6. Work in ${n} set phrases or sentence patterns that score well in Chinese exam essays (四六级/考研作文), such as "play a crucial role in", "It is widely acknowledged that", "not only ... but also", "There is no denying that", "be closely related to", "In conclusion". Use them where they fit naturally, never stacked together. In the TEXT, wrap each one exactly as written in double square brackets, e.g. "Tom [[not only]] cleared the path [[but also]] fixed the gate." List in "phrases" ONLY phrases that you actually wrapped in the text, with the base form, a Chinese meaning, and one short Chinese tip on how to use it in an essay.

Before replying, check your own text: count the {{...}} marks for each target word (every one must be 2 or more) and the [[...]] marks (must be ${n}). Fix it if not.`;
}

// Room for every required use. About one required word per 18 running words (two or three
// ordinary sentences between them) still reads like prose; denser than that it turns into a
// word list. The chosen length is a floor, not a cap.
const WORDS_PER_USE = 18;
function requiredUses(words, review = [], opts = {}) {
  const phrases = +String(PHRASE_COUNT[opts.genre] || "1").split(" ").pop();
  return words.length * 2 + review.length + phrases;
}
function targetLength(words, opts, review = []) {
  return Math.max(+opts.length || 250, Math.ceil(requiredUses(words, review, opts) * WORDS_PER_USE / 50) * 50);
}

function reviewBlock(review) {
  if (!review || !review.length) return "";
  const list = review.map((w) => `- ${w.word}${w.meaning ? `  (${w.meaning})` : ""}`).join("\n");
  return `
Review words (learned on earlier days, due for spaced review):
${list}
Use each review word ONCE, naturally. Mark them the same way: {{surface form|review word}}. Do not add them to "glossary".
For EACH review word, also add one extra quiz question that tests it (see the quiz rule), with "review": true.
`;
}

function buildPrompt(words, opts, review = []) {
  const list = words.map((w) => `- ${w.word}${w.meaning ? `  (${w.meaning})` : ""}`).join("\n");
  const craft = GENRE_CRAFT[opts.genre] || "";
  return `You are an experienced writer of graded readers for Chinese learners of English. Today the learner memorized these words:

${list}
${reviewBlock(review)}
Write ${opts.genre}, about ${targetLength(words, opts, review)} English words long, at the level of ${opts.level}.${opts.topic ? ` Topic: ${opts.topic}.` : ""}
${craft ? `\nWhat good writing in this form looks like: ${craft}\n` : ""}
Before writing, silently decide on one situation in which all of these words could plausibly come up, and build the text around it.

Rules:
1. Use EVERY target word at least TWICE (three times for the harder ones), in different sentences and ideally different paragraphs, so the learner meets it again after a gap. Vary the form or the role where natural (decay as a verb, later as a noun; erode, later eroded / erosion). Each use must make sense on its own; never repeat a word just by restating the same sentence. If meanings are given in brackets, use the word in one of those senses (senses are separated by "|"; prefer the most common one).
2. Mark every occurrence of a target word as {{surface form|target word}}, where "target word" is copied exactly from the list. Example: She {{abandoned|abandon}} the plan.
3. Apart from the target words, keep the vocabulary at or below the stated level.
4. Give a natural Chinese translation for each paragraph (意译，不要逐词硬译).
5. Write 4 multiple-choice fill-in-the-blank questions on the target words${review.length ? `, then ${review.length} more, one per review word (${review.map((w) => w.word).join(", ")}), each with "review": true and the review word as the correct option` : ""}. Each uses a NEW sentence (not copied from the passage) with "____" for the blank, and 4 options drawn from the target${review.length ? " and review" : ""} words. Exactly ONE option may fit grammatically and in meaning; check the other three are clearly wrong. "answer" is the 0-based index of the correct option.
${phraseRule(opts)}

${STYLE_RULES}

Reply with JSON only, no markdown fences, in exactly this shape:
{
  "title": "English title",
  "paragraphs": ["paragraph with {{marked|marked}} words", "..."],
  "translation": ["第一段中文翻译", "..."],
  "glossary": [{"word": "target word", "pos": "v.", "meaning": "在本文中的中文意思", "note": "常见搭配或用法，简短中文，可为空"}],
  "phrases": [{"phrase": "play a crucial role in", "meaning": "在……中起关键作用", "tip": "作文中怎么用，一句中文"}],
  "quiz": [{"question": "sentence with ____", "options": ["a","b","c","d"], "answer": 0, "explain": "中文解析"}${review.length ? `, {"question": "...", "options": [...], "answer": 2, "explain": "...", "review": true}` : ""}]
}`;
}

// Second pass: the model edits its own draft against a checklist. Most of the quality gap between
// cheap and expensive models is first-draft polish, which a focused revision pass recovers.
// Deterministic check of the rules the model tends to skip. Returns concrete, countable problems
// so the editor gets "add a second use of X" instead of a rule it already ignored once.
const PHRASE_MIN = {
  "an argumentative essay like an exam reading passage": 2,
};
function auditArticle(art, words, opts, review = []) {
  const counts = markCounts(art);
  const once = words.filter((w) => (counts.get(w.word.toLowerCase()) || 0) === 1).map((w) => w.word);
  const missing = words.filter((w) => !counts.get(w.word.toLowerCase())).map((w) => w.word);
  const reviewMissing = review.filter((w) => !counts.get(w.word.toLowerCase())).map((w) => w.word);
  const inText = (art.paragraphs.join(" ").match(/\[\[[^\[\]]+\]\]/g) || []).length;
  const phraseMin = PHRASE_MIN[opts.genre] || 1;
  const problems = [];
  if (missing.length) problems.push(`These target words are missing entirely: ${missing.join(", ")}. Add each one TWICE.`);
  if (once.length) problems.push(`These target words appear only ONCE: ${once.join(", ")}. Add a second, natural use of each in a different sentence (preferably a later paragraph), marked {{surface|word}}.`);
  if (reviewMissing.length) problems.push(`These review words are missing: ${reviewMissing.join(", ")}. Use each once.`);
  const untested = review.filter((w) => !reviewQuestionFor(art, w.word)).map((w) => w.word);
  if (untested.length) problems.push(`These review words have no quiz question: ${untested.join(", ")}. Add one fill-in-the-blank question for each, with "review": true and that word as the correct option.`);
  // Too dense: required words packed tighter than one per ~12 running words, or several
  // target words crammed into one sentence.
  const plain = art.paragraphs.join(" ").replace(/\{\{([^{}|]+)\|[^{}]+\}\}/g, "$1").replace(/\[\[|\]\]/g, "");
  const runWords = (plain.match(/[A-Za-z'’-]+/g) || []).length;
  const marks = [...counts.values()].reduce((s, n) => s + n, 0);
  if (marks && runWords / marks < 12) problems.push(`The text is too dense: ${marks} marked words in only ${runWords} running words. Add ordinary sentences (description, dialogue, action) between them so there are about ${WORDS_PER_USE} words per marked word; target about ${Math.ceil(marks * WORDS_PER_USE / 50) * 50} words in total.`);
  const crammed = art.paragraphs.join(" ").split(/(?<=[.!?])\s+/).filter((s) => (s.match(/\{\{/g) || []).length >= 3);
  if (crammed.length) problems.push(`${crammed.length} sentence(s) contain three or more marked words, e.g. "${crammed[0].replace(/\{\{([^{}|]+)\|[^{}]+\}\}/g, "$1").slice(0, 120)}". Split them so each sentence has at most two.`);
  if (inText < phraseMin) problems.push(`Only ${inText} exam set phrase(s) are marked [[...]] in the text; at least ${phraseMin} are required. Weave them into sentences that are already there. Every entry in "phrases" must appear in the text marked [[...]]; remove entries that don't.`);
  return { problems, ok: !problems.length };
}

// The quiz question that tests a given review word: its correct option is that word (or an
// inflected form of it). Matching on the answer, not the "review" flag, so it still works when
// the model forgets the flag.
function reviewQuestionFor(art, word) {
  const w = String(word).toLowerCase();
  const stem = (s) => s.toLowerCase().replace(/(ies|es|s|ed|ing|d)$/, "");
  return (art.quiz || []).findIndex((q) => {
    const ans = String(q.options?.[+q.answer] ?? "").toLowerCase().trim();
    return ans === w || (ans.length > 3 && stem(ans) === stem(w)) || ans.startsWith(w);
  }) + 1 || 0;   // 1-based index, 0 = none
}

// Keep only the essay phrases that really appear in the text, so the list never lies.
function syncPhrases(art) {
  const inText = (art.paragraphs.join(" ").match(/\[\[([^\[\]]+)\]\]/g) || []).map((s) => s.slice(2, -2).toLowerCase());
  // A listed phrase counts as used if each of its pieces ("not only", "but also") appears in some
  // marked span. Placeholders like sb/sth/doing and inflection on the first verb are tolerated.
  const norm = (s) => s.replace(/\b(sb|sth|someone|something|one's|doing|do)\b/g, " ").replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
  const stem = (w) => w.replace(/(ies|es|s|ed|ing)$/, "");
  const used = (p) => {
    const pieces = String(p.phrase).toLowerCase().split(/\.\.\.|…/).map(norm).filter(Boolean);
    return pieces.length > 0 && pieces.every((piece) => {
      const ws = piece.split(" ").map(stem);
      return inText.some((t) => { const tw = norm(t).split(" ").map(stem); return ws.every((w) => tw.includes(w)); });
    });
  };
  art.phrases = (art.phrases || []).filter(used);
  return art;
}

function buildRevisePrompt(draft, words, opts, review = []) {
  const list = words.map((w) => w.word).join(", ");
  const rlist = review.map((w) => w.word).join(", ");
  const { problems } = auditArticle(draft, words, opts, review);
  const must = problems.length
    ? `\nAn automatic check found these problems. Fix ALL of them; this is the most important part of the job:\n${problems.map((p, i) => `  ${String.fromCharCode(65 + i)}. ${p}`).join("\n")}\n`
    : "";
  return `You are a demanding editor of graded readers for Chinese learners of English (level: ${opts.level}). Below is a draft JSON produced by a writer. Target words: ${list}.${rlist ? ` Review words (use once each in the text, not in glossary; each needs its own quiz question with "review": true): ${rlist}.` : ""}
${must}
Then revise it. Check and fix, in this order:
1. Every target word must appear at least twice, in different sentences, all marked as {{surface|target}}. Every review word must appear once, marked the same way. Do not remove any marked occurrence. You may lengthen the text by up to 40% to make room.
2. Any target word in an unnatural collocation or a sentence that exists only to contain it (e.g. "the legislative rules of the school"): rewrite so the word is used the way a native writer would, even if that means changing the situation in the sentence.
2b. Factual errors (science, history, how things work): fix them. Example: water rises in plant stems by capillary action and transpiration, not gravity.
3. Flat or generic writing: replace vague phrases with concrete detail; vary sentence length; cut any moral spelled out at the end. Remove empty filler ("delve", "tapestry", "a testament to", "embark on a journey"). KEEP the exam set phrases marked [[...]] (they are there on purpose for exam practice); only fix them if they are used incorrectly or several are stacked in one sentence. Keep "phrases" consistent with the [[...]] marks.
4. Vocabulary above the level (other than target words): replace with simpler words.
5. Grammar, idiom, and article/preposition mistakes.
6. Chinese translation: must match the revised English and read like natural Chinese.
7. Quiz: each question must have exactly one correct option; fix any ambiguous ones. Keep "answer" correct.
8. Glossary: meanings must match how the word is used in the revised text.

Keep the same JSON shape and keys, about the same length, and the same {{surface|target}} marking. Reply with the complete revised JSON only, nothing else.

Draft:
${JSON.stringify(draft)}`;
}

// images: optional array of data: URLs (JPEG/PNG), sent alongside the prompt for vision models.
async function callModel(prompt, images = []) {
  const provider = $("provider").value;
  const base = $("baseUrl").value.trim().replace(/\/+$/, "");
  const model = $("model").value.trim();
  const key = $("apiKey").value.trim();
  if (!key) throw new UserError("还没有填写 API Key。展开左侧「API 设置」填好后再试。");
  if (!base || !model) throw new UserError("接口地址或模型名称为空，请在「API 设置」里补全。");

  let res, data;
  try {
    if (provider === "claude") {
      res = await fetch(`${base}/v1/messages`, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model, max_tokens: 8000, messages: [{ role: "user", content: images.length
          ? [...images.map((u) => ({ type: "image", source: { type: "base64", media_type: u.slice(5, u.indexOf(";")), data: u.slice(u.indexOf(",") + 1) } })),
             { type: "text", text: prompt }]
          : prompt }] }),
      });
    } else {
      const body = {
        model,
        temperature: images.length ? 0 : 0.8,
        messages: [
          { role: "system", content: "You reply with a single valid JSON object and nothing else." },
          { role: "user", content: images.length
            ? [{ type: "text", text: prompt }, ...images.map((u) => ({ type: "image_url", image_url: { url: u } }))]
            : prompt },
        ],
      };
      if (/api\.deepseek\.com/.test(base)) {
        // Writing a short passage doesn't need chain-of-thought; thinking is on by default and
        // would roughly double wait time and cost. JSON mode guarantees parseable output.
        body.thinking = { type: "disabled" };
        body.response_format = { type: "json_object" };
        body.max_tokens = 8000;
      }
      res = await fetch(`${base}/chat/completions`, {
        method: "POST",
        headers: { "content-type": "application/json", authorization: `Bearer ${key}` },
        body: JSON.stringify(body),
      });
    }
  } catch (e) {
    throw new UserError("请求没有发出去。可能是网络不通，或者这个服务商不允许从浏览器直接调用（跨域限制）。可以换一个服务商再试。", String(e));
  }
  const raw = await res.text();
  try { data = JSON.parse(raw); } catch { data = null; }
  if (!res.ok) {
    const msg = data?.error?.message || data?.message || raw.slice(0, 300);
    const hint = res.status === 401 ? "API Key 不正确或已失效。"
      : res.status === 402 ? "账户余额不足。"
      : res.status === 404 ? "接口地址或模型名称不对。"
      : res.status === 429 ? "请求太频繁或额度用完，稍后再试。"
      : `服务商返回了错误（${res.status}）。`;
    throw new UserError(hint, msg);
  }
  const text = provider === "claude"
    ? (data?.content || []).map((c) => c.text || "").join("")
    : data?.choices?.[0]?.message?.content || "";
  return text;
}

class UserError extends Error {
  constructor(msg, detail) { super(msg); this.detail = detail; }
}

// How many times each lemma is marked in the article.
function markCounts(art) {
  const c = new Map();
  art.paragraphs.join(" ").replace(/\{\{[^{}|]+\|([^{}]+)\}\}/g, (_, l) => {
    const k = l.trim().toLowerCase(); c.set(k, (c.get(k) || 0) + 1);
  });
  return c;
}
// Score used to decide whether the revision is better than the draft: words covered first,
// then words that reached two uses.
function usedCount(art, words) {
  const c = markCounts(art);
  const covered = words.filter((w) => c.get(w.word.toLowerCase())).length;
  const twice = words.filter((w) => (c.get(w.word.toLowerCase()) || 0) >= 2).length;
  const phrases = Math.min((art.paragraphs.join(" ").match(/\[\[[^\[\]]+\]\]/g) || []).length, 9);
  return covered * 1000 + twice * 10 + phrases;
}

function parseArticle(text) {
  let t = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new UserError("模型返回的内容不是 JSON，点「生成短文」再试一次。", text.slice(0, 500));
  let obj;
  try { obj = JSON.parse(t.slice(a, b + 1)); }
  catch (e) { throw new UserError("模型返回的 JSON 格式有误，点「生成短文」再试一次。", text.slice(0, 500)); }
  if (!Array.isArray(obj.paragraphs) || !obj.paragraphs.length) throw new UserError("模型返回的内容里没有正文，再试一次。", text.slice(0, 500));
  obj.translation = Array.isArray(obj.translation) ? obj.translation : [];
  obj.glossary = Array.isArray(obj.glossary) ? obj.glossary : [];
  obj.phrases = Array.isArray(obj.phrases) ? obj.phrases.filter((p) => p && p.phrase) : [];
  obj.quiz = Array.isArray(obj.quiz) ? obj.quiz.filter((q) => Array.isArray(q.options) && q.options.length) : [];
  return obj;
}

/* ---------------- state ---------------- */
let history = load(LS_HIST, []);
let batch = [];        // ids of entries shown as tabs
let currentId = null;
let showZh = false;
let plain = false;

/* ---------------- word bank: spaced review ----------------
   Each word ever imported is stored with the day it was learned and a review stage.
   A word is due when today >= due. A due word is mixed into an article AND quizzed; only a
   correct answer moves it to the next interval, a wrong one sends it back to "tomorrow". */
const LS_BANK = "wordreader.bank.v1";
const INTERVALS = [1, 2, 4, 7, 15, 30];       // days after each successful review
const REVIEW_PER_ARTICLE = 2;
let bank = load(LS_BANK, {});
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function addDays(key, n) { const [y, m, d] = key.split("-").map(Number); return dayKey(new Date(y, m - 1, d + n)); }
const saveBank = () => save(LS_BANK, bank);

// Register today's words. Re-importing a word that is already in the bank leaves its schedule alone.
function learnWords(words) {
  const today = dayKey();
  for (const w of words) {
    const k = w.word.toLowerCase();
    if (!bank[k]) bank[k] = { word: w.word, meaning: w.meaning || "", learned: today, stage: 0, due: addDays(today, INTERVALS[0]), seen: 0 };
    else if (w.meaning && !bank[k].meaning) bank[k].meaning = w.meaning;
  }
  saveBank();
}
// Words due today that are not in today's list. Words missed in a quiz (lapse) and the most
// overdue come first.
function dueWords(exclude) {
  const today = dayKey();
  const skip = new Set(exclude.map((w) => w.word.toLowerCase()));
  return Object.values(bank)
    .filter((b) => b.due <= today && !skip.has(b.word.toLowerCase()))
    .sort((a, b) => (b.lapse ? 1 : 0) - (a.lapse ? 1 : 0) || a.due.localeCompare(b.due));
}
// A review word was put into an article. Seeing it is not enough to count as reviewed: it is
// parked until tomorrow (so today's other articles don't reuse it), and only a correct quiz
// answer moves it to the next interval. If the quiz is never answered, it simply comes back
// tomorrow at the same stage.
function markShown(words) {
  const today = dayKey();
  for (const w of words) {
    const b = bank[w.word.toLowerCase()];
    if (!b || b.due > today) continue;
    b.due = addDays(today, 1);
    b.seen = (b.seen || 0) + 1;
    b.shownOn = today;
  }
  saveBank();
}
// Quiz answered right: advance one interval, counted from today.
function markRecalled(word) {
  const b = bank[String(word || "").toLowerCase()];
  if (!b) return;
  b.stage = Math.min((b.lapse ? 0 : b.stage) + 1, INTERVALS.length - 1);
  b.due = addDays(dayKey(), INTERVALS[b.stage]);
  b.lapse = false;
  b.recalled = (b.recalled || 0) + 1;
  saveBank();
}
// Quiz answered wrong: bring the word back tomorrow and restart its intervals.
function markMissed(word) {
  const b = bank[String(word || "").toLowerCase()];
  if (!b) return;
  b.stage = 0; b.due = addDays(dayKey(), 1); b.lapse = true;
  saveBank();
}
// Result for a word after a quiz answer, used in the feedback line under the question.
function scheduleNote(word) {
  const b = bank[String(word || "").toLowerCase()];
  if (!b) return "";
  const days = Math.round((new Date(b.due) - new Date(dayKey())) / 86400000);
  return days <= 1 ? "明天再复习这个词" : `${days} 天后再复习`;
}
// Articles generated before the word bank existed: put their words in, scheduled from the day
// they were learned, so they aren't lost.
function backfillBank() {
  let changed = false;
  for (const h of history) {
    if (String(h.id).startsWith("demo-")) continue;
    const day = dayKey(new Date(h.created));
    for (const w of h.words || []) {
      const k = w.word.toLowerCase();
      if (bank[k]) continue;
      bank[k] = { word: w.word, meaning: w.meaning || "", learned: day, stage: 0, due: addDays(day, INTERVALS[0]), seen: 0 };
      changed = true;
    }
  }
  if (changed) saveBank();
}
// With a daily cap, choose which of the imported words get written into today's articles.
// The learner adds new words every day, so a "write everything eventually" queue would grow
// without end. Instead: newest words first (learned today, then yesterday...). A word that
// wasn't written within CARRY_DAYS of being learned stops waiting for an article of its own;
// it is already in the word bank, so spaced review mixes it into later articles and quizzes it.
const CARRY_DAYS = 2;
function pickToday(words, max) {
  const today = dayKey();
  const age = (b) => Math.round((new Date(today) - new Date(b.learned)) / 86400000);
  const cands = [], toReview = [];
  words.forEach((w, i) => {
    const b = bank[w.word.toLowerCase()];
    if (!b) { cands.push({ w, r: [0, i] }); return; }                 // brand new
    if (b.written) { if (b.writtenOn !== today) toReview.push(w); return; }  // done; review handles it
    if (age(b) > CARRY_DAYS) { toReview.push(w); return; }           // waited too long; review handles it
    cands.push({ w, r: [age(b), i] });
  });
  cands.sort((a, b) => a.r[0] - b.r[0] || a.r[1] - b.r[1]);
  const chosen = new Set(cands.slice(0, max).map((o) => o.w));
  // Keep the chosen words in their original list order so related words stay together.
  return {
    pick: words.filter((w) => chosen.has(w)),
    rest: cands.slice(max).map((o) => o.w),       // still waiting, may be picked tomorrow
    toReview,
  };
}
function markWritten(words) {
  const today = dayKey();
  for (const w of words) {
    const b = bank[w.word.toLowerCase()];
    if (b) { b.written = (b.written || 0) + 1; b.writtenOn = today; }
  }
  saveBank();
}
// Plan for today's run, shared by the generate button and the count line in the drawer.
function planToday(words) {
  const per = +$("per").value || 8;
  const maxArt = +$("maxArticles").value || 3;
  const cap = Math.min(words.length, per * maxArt);
  const { pick, rest } = pickToday(words, cap);
  // Nothing new to write (everything imported was already covered): one review-only article
  // with more due words instead, so the button still does something useful.
  if (!pick.length) {
    const due = dueWords([]).slice(0, Math.max(4, REVIEW_PER_ARTICLE * 3));
    return { pick, rest, groups: due.length ? [[]] : [], due, reviewOnly: true };
  }
  const groups = chunk(pick, per);
  const due = dueWords(pick).slice(0, groups.length * REVIEW_PER_ARTICLE);
  return { pick, rest, groups, due };
}

function bankStats() {
  const today = dayKey();
  const all = Object.values(bank);
  return { total: all.length, due: all.filter((b) => b.due <= today).length };
}

// Split into the fewest groups of at most n, sized as evenly as possible (84 at 8 -> 11 groups
// of 7-8, not 10 of 8 plus one of 4). Uneven groups make some articles much denser than others.
function chunk(arr, n) {
  const groups = Math.max(1, Math.ceil(arr.length / n));
  const base = Math.floor(arr.length / groups), extra = arr.length % groups;
  const out = [];
  let i = 0;
  for (let g = 0; g < groups; g++) { const size = base + (g < extra ? 1 : 0); out.push(arr.slice(i, i + size)); i += size; }
  return out;
}

async function generate() {
  if ($("go").disabled) return;   // a batch is already running
  const words = parseWords($("words").value);
  if (!words.length) {
    setDrawer(true);
    $("importMsg").hidden = false; $("importMsg").className = "count bad";
    $("importMsg").textContent = "还没有单词。先导入 PDF，或者手动粘贴，每行一个。";
    return;
  }
  if (!$("apiKey").value.trim()) {
    setDrawer(true);
    $("settingsBox").open = true;
    $("apiKey").focus();
    $("keyState").textContent = "先填 Key 才能生成";
    $("keyState").className = "state";
    return;
  }
  if (!wide()) setDrawer(false);
  persistSettings();
  const opts = {
    level: $("level").value,
    genre: $("genre").value,
    length: $("length").value,
    topic: $("topic").value.trim(),
    genreLabel: $("genre").selectedOptions[0].textContent,
    levelLabel: $("level").selectedOptions[0].textContent,
    refine: true,
  };
  // All imported words enter the word bank (so they get scheduled), but only today's share is
  // written into articles; review words are handed out a few per article.
  learnWords(words);
  if (isNights(opts.genre)) return generateNight(words, opts);
  const plan = planToday(words);
  const { groups, due, rest } = plan;
  opts.restCount = rest.length;
  const asWord = (b) => ({ word: b.word, meaning: b.meaning });
  if (!groups.length) {
    setDrawer(true);
    $("importMsg").hidden = false; $("importMsg").className = "count";
    $("importMsg").textContent = "这些词都已经写过文章了，今天也没有该复习的词。导入新的单词再生成吧。";
    return;
  }
  // Review-only day: the due words become the article's words, so they are used twice and
  // all of them get quiz questions; answering them advances their schedule as usual.
  const tasks = plan.reviewOnly
    ? [{ index: 0, words: due.map(asWord), review: [], reviewOnly: true }]
    : groups.map((g, i) => ({ index: i, words: g,
        review: due.slice(i * REVIEW_PER_ARTICLE, (i + 1) * REVIEW_PER_ARTICLE).map(asWord) }));
  await runBatch(tasks, opts, Date.now().toString(36));
}

/* ================= 一千零一夜: one long installment per night =================
   Why this form: a frame story with a fixed narrator and listener gives continuity (the reader
   follows along night after night), while each night's inner tale can change setting freely, so
   40 unrelated words fit naturally. Inside the tale, characters argue a case, read a letter or
   explain how something works, which gives exam-style argumentative and expository passages
   (考研阅读) alongside narrative.
   Each night = 4 parts written in parallel from one shared outline, each part about 10 words
   and ~400 running words, then joined into one ~1600-word text. The "story bible" (characters,
   past tales, open threads) is kept in the browser and fed to every night so it stays coherent. */
const LS_NIGHTS = "wordreader.nights.v1";
const NIGHT_WORDS = 40;
const NIGHT_PARTS = 4;
const NIGHT_REVIEW = 6;
let nights = load(LS_NIGHTS, { count: 0, frame: null, tales: [], hook: "" });
const saveNights = () => save(LS_NIGHTS, nights);

const PART_ROLES = [
  { name: "开场", mode: "narrative", brief: "Frame: open tonight's session in the palace (one short scene with the narrator and the listener, picking up last night's hook). Then begin tonight's tale: set the place, the main character and what they want." },
  { name: "发展", mode: "narrative", brief: "The tale develops: a complication, a journey or a discovery. Concrete scenes and some dialogue." },
  { name: "辩论", mode: "argument", brief: "Inside the tale, characters must decide something important. Write it as a formal argument: one character makes a reasoned case (like a 考研 reading passage: thesis, evidence, an opposing view answered, a measured conclusion), another objects, possibly through a letter or a petition that is quoted in full." },
  { name: "结尾", mode: "narrative", brief: "Resolve tonight's tale. Then return to the frame: a brief exchange between narrator and listener, and end on a new hook that makes the listener (and reader) want tomorrow night." },
];

function nightsFrameBlock() {
  if (!nights.frame) {
    return `This is NIGHT 1 of a new serial in the style of One Thousand and One Nights. Invent the frame: a narrator (a young storyteller) who must keep a powerful listener interested each night, a reason why it matters, and the palace setting. Keep it original (not a retelling of the classic), modern in tone, suitable for adult learners.`;
  }
  const last = nights.tales.slice(-5).map((t) => `  - Night ${t.night}: "${t.title}": ${t.summary}`).join("\n");
  return `This is NIGHT ${nights.count + 1} of an ongoing serial in the style of One Thousand and One Nights.
Frame story (keep consistent): ${nights.frame}
Recent nights:
${last || "  (none)"}
Last night ended on this hook: ${nights.hook || "(none)"}
Tonight's inner tale must be NEW (different place and characters from the recent nights), but the frame continues.`;
}

// One call that plans the whole night, so the four parts written in parallel fit together.
function nightOutlinePrompt(groups, review, opts) {
  return `You are planning tonight's installment of a graded-reader serial for Chinese students preparing for 考研/四六级 (level: ${opts.level}).
${nightsFrameBlock()}

Tonight is told in ${NIGHT_PARTS} consecutive parts, about 400 words each. Part roles:
${PART_ROLES.map((r, i) => `  Part ${i + 1} (${r.mode}): ${r.brief}`).join("\n")}

Each part must naturally use its own word list (the writer will use each word twice):
${groups.map((g, i) => `  Part ${i + 1}: ${g.map((w) => w.word).join(", ")}`).join("\n")}
${review.length ? `Review words, to appear once anywhere tonight: ${review.map((w) => w.word).join(", ")}` : ""}

Plan the night so each part's words fit its events (choose situations that make those words natural).
Reply with JSON only:
{"title": "tonight's English title",
 ${nights.frame ? "" : `"frame": "2-3 sentences describing the frame story, narrator and listener (names), and the stakes",\n `}"parts": [{"beats": "3-5 sentences: exactly what happens in this part, who speaks, which words go where"}],
 "summary": "2 sentences summarizing tonight's tale (for continuity)",
 "hook": "the cliffhanger the night ends on (1 sentence)"}`;
}

function nightPartPrompt(part, idx, outline, words, review, opts) {
  const role = PART_ROLES[idx];
  const prev = idx > 0 ? `Previous part (for continuity, do not repeat it): ${outline.parts[idx - 1]?.beats || ""}` : "";
  const next = idx < NIGHT_PARTS - 1 ? `Next part will cover: ${outline.parts[idx + 1]?.beats || ""}` : "";
  const craft = role.mode === "argument"
    ? "This part is argumentative, like a 考研 reading passage spoken or written by a character: a clear claim, two pieces of concrete evidence, one opposing view stated fairly and answered, a measured conclusion. Use formal written English for the argument itself; keep the surrounding narration short."
    : "Narrative: one or two concrete scenes, sensory detail, a few lines of natural dialogue, varied sentence length. Do not summarize what should be shown.";
  const sub = { ...opts, genre: role.mode === "argument" ? "an argumentative essay like an exam reading passage" : "a short story with characters and a plot" };
  const base = buildPrompt(words, sub, review)
    .replace(/^You are an experienced writer[^\n]*\n/, `You are writing PART ${idx + 1} of ${NIGHT_PARTS} of tonight's installment ("${outline.title}") of a One Thousand and One Nights style serial for Chinese learners of English. The learner memorized these words today:\n`)
    .replace(/Write [^\n]*English words long[^\n]*\n/, `Write about 400 English words for this part, at the level of ${opts.level}. It is one continuous section of a longer text: no title of its own, no summary of other parts.\n`)
    .replace(/Before writing, silently decide[^\n]*\n/, `Story so far: ${nights.frame || outline.frame || ""}\nThis part: ${part.beats}\n${prev}\n${next}\nHow to write it: ${craft}\n`);
  return base;
}

function nightsAvailable() { return isNights($("genre").value); }

async function generateNight(words, opts) {
  const plan = planNight(words);
  if (!plan.groups.length) {
    setDrawer(true);
    $("importMsg").hidden = false; $("importMsg").className = "count";
    $("importMsg").textContent = "这些词都已经写进故事了，今天也没有该复习的词。导入新的单词再生成吧。";
    return;
  }
  const batchId = "n" + Date.now().toString(36);
  batch = [];
  job = { batchId, total: 1, done: 0, failed: [], running: true, opts };
  $("go").disabled = true;
  renderTabs();
  const stage = (t, sub) => { $("sheet").className = "sheet"; $("sheet").innerHTML = `<div class="loading">${buddy(t, sub, { wave: "live" })}</div>`; };
  const asWord = (b) => ({ word: b.word, meaning: b.meaning });
  try {
    stage(`第 ${nights.count + 1} 夜：正在构思今晚的故事…`, `今晚用 ${plan.pick.length} 个新词${plan.due.length ? `、${plan.due.length} 个复习词` : ""}，分 ${plan.groups.length} 段写，一共大约 ${plan.groups.length * 400} 词。通常需要 2 到 4 分钟。`);
    const outlineRaw = await callModel(nightOutlinePrompt(plan.groups, plan.due, opts));
    const outline = parseAiJson(outlineRaw);
    if (!outline || !Array.isArray(outline.parts)) throw new UserError("构思今晚的故事时模型返回的格式不对，再点一次生成试试。", outlineRaw.slice(0, 400));
    while (outline.parts.length < plan.groups.length) outline.parts.push({ beats: "Continue the tale naturally." });
    // Review words go to the narrative parts first; the argument part is already dense.
    const reviewFor = plan.groups.map(() => []);
    plan.due.map(asWord).forEach((w, i) => reviewFor[[0, 1, 3, 2][i % 4] % plan.groups.length].push(w));

    let done = 0;
    const tick = () => stage(`第 ${nights.count + 1} 夜《${esc(outline.title || "")}》`, `已写好 ${done} / ${plan.groups.length} 段，每段写完会再精修一遍…`);
    tick();
    const parts = await Promise.all(plan.groups.map(async (g, i) => {
      const art = await writeChecked(nightPartPrompt(outline.parts[i], i, outline, g, reviewFor[i], opts), g, reviewFor[i],
        { ...opts, genre: PART_ROLES[i].mode === "argument" ? "an argumentative essay like an exam reading passage" : "a short story with characters and a plot" });
      done++; tick();
      return art;
    }));

    // Join the parts into one article; every section keeps its own paragraphs and translation.
    const art = {
      title: outline.title || `Night ${nights.count + 1}`,
      night: nights.count + 1,
      sections: parts.map((p, i) => ({ name: PART_ROLES[i].name, from: 0, to: 0, len: p.paragraphs.length })),
      paragraphs: [], translation: [], glossary: [], phrases: [], quiz: [], refined: parts.every((p) => p.refined),
    };
    parts.forEach((p, i) => {
      art.sections[i].from = art.paragraphs.length;
      art.paragraphs.push(...p.paragraphs);
      art.translation.push(...p.paragraphs.map((_, j) => p.translation[j] || ""));
      art.sections[i].to = art.paragraphs.length;
      art.glossary.push(...p.glossary);
      art.phrases.push(...(p.phrases || []));
      // Keep every review-word question (they drive the review schedule) and two word questions
      // per part, so the night ends with about 8 word questions plus 5 reading questions.
      const rvIdx = new Set(reviewFor[i].map((w) => reviewQuestionFor(p, w.word) - 1).filter((x) => x >= 0));
      let kept = 0;
      p.quiz.forEach((q, qi) => { if (rvIdx.has(qi) || (!rvIdx.has(qi) && kept++ < 2)) art.quiz.push(q); });
    });
    stage(`第 ${nights.count + 1} 夜《${esc(art.title)}》`, "四段都写好了，正在出阅读理解题…");
    art.reading = await readingQuiz(art).catch(() => []);

    const allWords = plan.groups.flat();
    const allReview = reviewFor.flat();
    const counts = markCounts(art);
    const reviewed = allReview.filter((w) => counts.get(w.word.toLowerCase()));
    markShown(reviewed);
    if (plan.reviewNight) markShown(allWords.filter((w) => counts.get(w.word.toLowerCase())));
    else markWritten(allWords);
    nights.count += 1;
    if (!nights.frame) nights.frame = outline.frame || "";
    nights.tales.push({ night: nights.count, title: art.title, summary: outline.summary || "" });
    nights.tales = nights.tales.slice(-30);
    nights.hook = outline.hook || "";
    saveNights();

    const entry = { id: `${batchId}-0`, batchId, index: 0, created: new Date().toISOString(), words: allWords, review: reviewed,
      reviewOnly: !!plan.reviewNight, opts: { ...opts, genreLabel: `一千零一夜，第 ${art.night} 夜` }, article: art, quizState: {}, readingState: {}, night: art.night };
    history.unshift(entry);
    history = history.slice(0, 200);
    save(LS_HIST, history);
    batch = [entry.id];
    job.done = 1;
    renderHistory();
    show(entry.id);
  } catch (e) {
    renderError(e, "今晚的故事没写成：");
  } finally {
    job.running = false;
    $("go").disabled = false;
    renderTabs();
  }
}

// Shared by short articles and night parts: draft, then up to two audit-driven edits.
async function writeChecked(prompt, words, review, opts) {
  let art = parseArticle(await callModel(prompt));
  for (let round = 0; round < 2; round++) {
    if (round > 0 && auditArticle(art, words, opts, review).ok) break;
    try {
      const rev = parseArticle(await callModel(buildRevisePrompt(art, words, opts, review)));
      if (usedCount(rev, words) >= usedCount(art, words)) { rev.refined = true; art = rev; }
    } catch (e) {
      if (e instanceof UserError && /Key|余额|地址|没有发出去/.test(e.message)) throw e;
      break;
    }
  }
  return syncPhrases(art);
}

function parseAiJson(text) {
  const t = String(text).trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  try { return JSON.parse(t.slice(a, b + 1)); } catch { return null; }
}

// Reading-comprehension questions on the whole night, in the style of 考研英语阅读:
// main idea, detail, inference, attitude, and meaning of a word in context.
async function readingQuiz(art) {
  const plain = art.paragraphs.map((p) => p.replace(/\{\{([^{}|]+)\|[^{}]+\}\}/g, "$1").replace(/\[\[|\]\]/g, "")).join("\n\n");
  const raw = await callModel(`Write 5 reading-comprehension questions on the text below, in the style of 考研英语阅读理解 (Part A). One each: main idea / title; a specific detail; an inference (what can be inferred); the author's or a character's attitude; the meaning of a word or phrase in context. Each has 4 options (A-D) in English; distractors must be plausible and tempting (partly true, too absolute, or true but not stated), with exactly one defensible answer. Put the questions in the order of the text. Explain the answer in Chinese, pointing to the sentence that proves it.
Reply with JSON only: {"questions": [{"type": "主旨|细节|推断|态度|词义", "question": "...", "options": ["...","...","...","..."], "answer": 0, "explain": "中文解析"}]}

Text:
${plain}`);
  const obj = parseAiJson(raw);
  return (obj?.questions || []).filter((q) => Array.isArray(q.options) && q.options.length === 4).slice(0, 5);
}

// Today's words for the night: newest first, up to NIGHT_WORDS, split into the four parts.
function planNight(words) {
  const { pick, rest } = pickToday(words, NIGHT_WORDS);
  const due = dueWords(pick).slice(0, NIGHT_REVIEW);
  // Parts: up to four, about ten words each; fewer words means fewer (not thinner) parts.
  const split = (list) => {
    const n = Math.min(NIGHT_PARTS, Math.max(1, Math.ceil(list.length / 10)));
    return chunk(list, Math.ceil(list.length / n));
  };
  if (!pick.length) {
    // Nothing new: a review night built from up to 24 due words, which count as reviewed.
    const dueOnly = dueWords([]).slice(0, 24).map((b) => ({ word: b.word, meaning: b.meaning }));
    return { pick: dueOnly, rest, due: [], groups: dueOnly.length ? split(dueOnly) : [], reviewNight: true };
  }
  return { pick, rest, due, groups: split(pick) };
}

// Generates several articles with up to 3 requests in flight. Each article appears as soon as it
// is ready; failures are collected and offered for retry instead of stopping the whole batch.
let job = null;
async function runBatch(tasks, opts, batchId) {
  const total = tasks.length;
  if (!job || job.batchId !== batchId) { batch = []; }
  job = { batchId, total: job?.batchId === batchId ? job.total : total, done: batch.length, failed: [], running: true, opts };
  $("go").disabled = true;
  if (!batch.length) renderLoading(total, tasks[0].words);
  renderTabs();

  const queue = tasks.slice();
  let lastError = null;
  async function worker() {
    while (queue.length) {
      const t = queue.shift();
      try {
        const review = t.review || [];
        let art = parseArticle(await callModel(buildPrompt(t.words, opts, review)));
        if (opts.refine) {
          // Up to two editing rounds. Round 1 is the full edit with the audit's problem list;
          // round 2 runs only if the audit still fails. A revision is kept only if it parses and
          // scores at least as well as what we have, so a bad edit can never make things worse.
          for (let round = 0; round < 2; round++) {
            if (round > 0 && auditArticle(art, t.words, opts, review).ok) break;
            try {
              const rev = parseArticle(await callModel(buildRevisePrompt(art, t.words, opts, review)));
              if (usedCount(rev, t.words) >= usedCount(art, t.words)) { rev.refined = true; art = rev; }
            } catch (e) {
              if (e instanceof UserError && /Key|余额|地址|没有发出去/.test(e.message)) throw e;
              break;
            }
          }
        }
        syncPhrases(art);
        // Only review words that actually made it into the text count as reviewed.
        const counts = markCounts(art);
        const reviewed = review.filter((w) => counts.get(w.word.toLowerCase()));
        markShown(reviewed);
        if (t.reviewOnly) markShown(t.words.filter((w) => counts.get(w.word.toLowerCase())));
        else markWritten(t.words);
        const entry = { id: `${batchId}-${t.index}`, batchId, index: t.index, created: new Date().toISOString(),
          words: t.words, review: reviewed, reviewOnly: !!t.reviewOnly, opts, article: art, quizState: {} };
        history.unshift(entry);
        history = history.slice(0, 200);
        save(LS_HIST, history);
        batch.push(entry.id);
        batch.sort((a, b) => +a.split("-").pop() - +b.split("-").pop());
        job.done++;
        renderHistory();
        if (!currentId || !batch.includes(currentId)) show(entry.id); else renderTabs();
      } catch (e) {
        job.failed.push(t);
        lastError = e;
        // Wrong key / no balance: every remaining request would fail the same way.
        if (e instanceof UserError && /Key|余额|地址|没有发出去/.test(e.message)) { job.failed.push(...queue.splice(0)); }
        renderTabs();
      }
    }
  }
  await Promise.all(Array.from({ length: Math.min(3, tasks.length) }, worker));
  job.running = false;
  $("go").disabled = false;
  renderTabs();
  if (job.failed.length) {
    job.failed.sort((a, b) => a.index - b.index);
    renderError(lastError, batch.length ? `已生成 ${batch.length} 篇，${job.failed.length} 篇失败。` : "", job.failed.length);
  }
}
function retryFailed() {
  if (!job || !job.failed.length || job.running) return;
  document.querySelectorAll(".error").forEach((e) => e.remove());
  runBatch(job.failed.slice(), job.opts, job.batchId);
}
$("go").addEventListener("click", generate);

/* ---------------- rendering ---------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderMarked(text, reviewSet = new Set()) {
  return esc(text)
    .replace(/\{\{([^{}|]+)\|([^{}]+)\}\}/g, (_, surface, lemma) => {
      const k = lemma.trim().toLowerCase();
      return `<mark class="w${reviewSet.has(k) ? " rv" : ""}" tabindex="0" data-w="${k}"${reviewSet.has(k) ? ' title="复习词"' : ""}>${surface}</mark>`;
    })
    .replace(/\[\[([^\[\]]+)\]\]/g, (_, p) => `<span class="ph" title="作文句式">${p}</span>`);
}

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function show(id) {
  const e = history.find((h) => h.id === id);
  if (!e) return;
  currentId = id;
  if (!batch.includes(id)) {
    batch = history.filter((h) => h.batchId === e.batchId)
      .sort((a, b) => (a.index ?? 0) - (b.index ?? 0) || a.created.localeCompare(b.created)).map((h) => h.id);
  }
  renderTabs();
  renderHistory();
  renderArticle(e);
  window.scrollTo({ top: 0 });
}

function renderTabs() {
  const tabs = $("tabs");
  const live = job && (!batch.length || batch[0].startsWith(job.batchId + "-"));
  const pending = live && job.running ? job.total - job.done - job.failed.length : 0;
  const failed = live && !job.running ? job.failed.length : 0;
  if (batch.length < 2 && !pending && !failed) { tabs.innerHTML = ""; return; }
  tabs.innerHTML = batch.map((id, i) =>
    `<button role="tab" data-id="${id}" aria-selected="${id === currentId}">第 ${i + 1} 篇</button>`).join("")
    + (pending ? `<span class="tabnote">还有 ${pending} 篇在写…</span>` : "")
    + (failed ? `<button class="retry" id="retryTab">重试失败的 ${failed} 篇</button>` : "");
}
$("tabs").addEventListener("click", (ev) => {
  if (ev.target.id === "retryTab") { retryFailed(); return; }
  const b = ev.target.closest("button[data-id]");
  if (b) show(b.dataset.id);
});

function renderArticle(e) {
  const a = e.article;
  const counts = markCounts(a);
  const missing = e.words.filter((w) => !counts.get(w.word.toLowerCase())).map((w) => w.word);
  const reviewSet = new Set((e.review || []).map((w) => w.word.toLowerCase()));
  const repeated = e.words.filter((w) => (counts.get(w.word.toLowerCase()) || 0) >= 2).length;

  // Night installments carry section boundaries; a small divider marks where each part starts.
  const sectionAt = new Map((a.sections || []).map((s, i) => [s.from, { ...s, i }]));
  const paras = a.paragraphs.map((p, i) => {
    const s = sectionAt.get(i);
    const head = s && s.i > 0 ? `<div class="part-break" aria-hidden="true">${s.i === 2 ? "◆" : "·  ·  ·"}</div>` : "";
    return `${head}<p class="en">${renderMarked(p, reviewSet)}</p>${a.translation[i] ? `<p class="zh">${esc(a.translation[i])}</p>` : ""}`;
  }).join("");

  // Reading comprehension (考研-style): main idea, detail, inference, attitude, word in context.
  const rs = e.readingState || {};
  const reading = (a.reading || []).map((q, qi) => {
    const picked = rs[qi], done = picked != null;
    const opts = q.options.map((o, oi) => {
      const cls = done && oi === +q.answer ? "right" : done && oi === picked ? "bad" : "";
      return `<button data-r="${qi}" data-o="${oi}" class="${cls}" ${done ? "disabled" : ""}><b>${"ABCD"[oi]}.</b> ${esc(o)}</button>`;
    }).join("");
    return `<div class="q q-read"><p class="stem">${qi + 1}. <span class="rd-tag">${esc(q.type || "阅读")}</span>${esc(q.question)}</p><div class="opts opts-col">${opts}</div>
      ${done && q.explain ? `<div class="exp">${esc(q.explain)}</div>` : ""}</div>`;
  }).join("");
  const rAnswered = Object.keys(rs).length, rRight = (a.reading || []).filter((q, i) => rs[i] === +q.answer).length;
  const rScore = a.reading?.length && rAnswered === a.reading.length ? `<p class="score">阅读理解答对 ${rRight} / ${a.reading.length}</p>` : "";

  const gloss = a.glossary.map((g) => `
    <span class="hw">${esc(g.word)}</span><span class="pos">${esc(g.pos)}</span><span>${esc(g.meaning)}</span>
    ${g.note ? `<span class="note">${esc(g.note)}</span>` : ""}`).join("");

  const qs = e.quizState || {};
  // Which quiz question tests which review word (0-based question index -> word).
  const reviewOf = new Map();
  for (const w of e.review || []) { const i = reviewQuestionFor(a, w.word); if (i) reviewOf.set(i - 1, w.word); }
  const quiz = a.quiz.map((q, qi) => {
    const picked = qs[qi];
    const done = picked != null;
    const opts = q.options.map((o, oi) => {
      let cls = "";
      if (done && oi === +q.answer) cls = "right";
      else if (done && oi === picked) cls = "bad";
      return `<button data-q="${qi}" data-o="${oi}" class="${cls}" ${done ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("");
    const rv = reviewOf.get(qi);
    const note = done && rv ? `<div class="exp rv-note">${picked === +q.answer ? "答对了。" : "答错了。"}${esc(scheduleNote(rv))}</div>` : "";
    return `<div class="q${rv ? " q-rv" : ""}"><p class="stem">${qi + 1}. ${rv ? `<span class="rv-tag">复习</span>` : ""}${esc(q.question)}</p><div class="opts">${opts}</div>
      ${done && q.explain ? `<div class="exp">${esc(q.explain)}</div>` : ""}${note}</div>`;
  }).join("");
  const answered = Object.keys(qs).length;
  const right = a.quiz.filter((q, i) => qs[i] === +q.answer).length;
  const total = a.quiz.length;
  const cheerText = right === total ? "全对了，今天的词记得很牢。"
    : right >= total / 2 ? "不错，错的那几个词明天再看一眼就好。"
    : "没关系，回到文章里再读一遍那几个词吧。";
  const score = answered === total && total
    ? buddy(`答对 ${right} / ${total}。${cheerText}`, "", { cls: "cheer" }) : "";

  const pos = batch.indexOf(e.id);
  const prevE = pos > 0 ? history.find((h) => h.id === batch[pos - 1]) : null;
  const nextE = pos >= 0 && pos < batch.length - 1 ? history.find((h) => h.id === batch[pos + 1]) : null;
  const pager = prevE || nextE ? `<nav class="pager">
      ${prevE ? `<button data-go="${prevE.id}"><small>上一篇</small><span>${esc(prevE.article.title)}</span></button>` : ""}
      ${nextE ? `<button class="next" data-go="${nextE.id}"><small>下一篇</small><span>${esc(nextE.article.title)}</span></button>` : ""}
    </nav>` : "";

  $("sheet").className = `sheet${showZh ? "" : " hide-zh"}${plain ? " plain" : ""}`;
  $("sheet").innerHTML = `
    <div class="toolbar">
      <button class="chip" id="tZh" aria-pressed="${showZh}">
        <svg viewBox="0 0 24 24"><path d="M4 5h8M8 3v2M6 5c0 4 3 7 6 8M10 5c0 4-3 7-6 8M13 21l4-9 4 9M14.5 18h5"/></svg>中文翻译</button>
      <button class="chip" id="tPlain" aria-pressed="${plain}">
        <svg viewBox="0 0 24 24"><path d="M3 21h6M14 4l6 6-9 9H7v-4z"/></svg>隐藏高亮</button>
      <span class="spacer"></span>
      <button class="chip" id="copyMd">复制</button>
      <button class="chip" id="printIt">打印</button>
    </div>
    <article>
      <h1>${esc(a.title)}</h1>
      <p class="meta"><b>${esc(e.opts.levelLabel)}${e.night ? "，" : ""}${esc(e.opts.genreLabel)}</b>，${e.words.length} 个${e.reviewOnly ? "复习词" : "新词"}${repeated ? `（${repeated} 个出现了两次以上）` : ""}${reviewSet.size ? `，${reviewSet.size} 个<span class="rv-key">复习词</span>` : ""}，${a.refined ? "已精修，" : ""}${fmtDate(e.created)}</p>
      ${missing.length ? `<p class="missing">这篇没有用到：${missing.map(esc).join(", ")}</p>` : ""}
      ${paras}
    </article>
    ${a.glossary.length ? `<section class="block"><h2>本文单词</h2><div class="gloss">${gloss}</div></section>` : ""}
    ${(a.phrases || []).length ? `<section class="block"><h2>作文句式</h2><p class="phr-intro">文中带虚线的是考试作文里常用的表达，可以直接借用。</p><div class="phr">${a.phrases.map((p) => `
      <div><span class="pp">${esc(p.phrase)}</span><span class="pm">${esc(p.meaning)}</span>${p.tip ? `<span class="pt">${esc(p.tip)}</span>` : ""}</div>`).join("")}</div></section>` : ""}
    ${(a.reading || []).length ? `<section class="block"><h2>阅读理解</h2><p class="phr-intro">按考研阅读的题型出：主旨、细节、推断、态度、词义。</p>${reading}${rScore}</section>` : ""}
    ${a.quiz.length ? `<section class="block"><h2>${a.reading?.length ? "单词小测验" : "小测验"}</h2>${quiz}${score}</section>` : ""}
    ${pager}
  `;
}

function renderLoading(n, words) {
  $("sheet").className = "sheet";
  $("sheet").innerHTML = `<div class="loading">${buddy(
    n > 1 ? `正在写 ${n} 篇短文，第一篇写好就会显示。` : `正在写短文，用到 ${words.map((w) => esc(w.word)).join(", ")}。`,
    "每篇先写初稿再精修一遍，通常需要 40 到 80 秒。" + (job?.opts?.restCount ? `今天先写这些，剩下 ${job.opts.restCount} 个词之后几天优先安排。` : ""),
    { wave: "live" })}</div>`;
}

function renderError(e, prefix = "", retryCount = 0) {
  const box = document.createElement("div");
  box.className = "error";
  box.innerHTML = `${esc(prefix)}${esc(e.message || String(e))}${e.detail ? `<pre>${esc(e.detail)}</pre>` : ""}`
    + (retryCount ? `<button class="retry" data-retry>重试失败的 ${retryCount} 篇</button>` : "");
  const sheet = $("sheet");
  if (sheet.querySelector("article")) sheet.prepend(box);
  else { sheet.className = "sheet"; sheet.innerHTML = ""; sheet.append(box); }
}

function renderIntro() {
  $("tabs").innerHTML = "";
  $("sheet").className = "sheet";
  const hasKey = !!$("apiKey").value.trim();
  $("sheet").innerHTML = `<div class="intro">
    ${(() => { const s = bankStats();
      return buddy(greeting(), s.due ? `有 ${s.due} 个旧词今天该复习了，会混进今天的文章里。` : s.total ? `已经一起读过 ${s.total} 个词了。` : "今天也一起读一篇吧。", { wave: "idle" }); })()}
    <button class="drop-zone" id="introPick">
      <b>选择今天的单词文件</b>
      <span>PDF、Word、Excel、TXT 或图片都可以，选好就自动开始写，也可以直接拖到这里</span>
    </button>
    ${hasKey ? "" : `<p class="small">第一次用要先填 API Key，只用填一次。<button class="link" id="openKey">现在去填</button></p>`}
    <p class="small"><button class="link" id="demo">先看一篇示例</button></p>
  </div>`;
}

function renderHistory() {
  const ul = $("hist");
  if (!history.length) { ul.innerHTML = `<li class="empty">生成的短文会保存在这里</li>`; return; }
  ul.innerHTML = history.slice(0, 60).map((h) => `
    <li><button class="open" data-id="${h.id}" aria-current="${h.id === currentId}">
      <span class="d">${h.night ? `第 ${h.night} 夜，` : ""}${fmtDate(h.created)}，${h.words.length} 词</span>
      <span class="t">${esc(h.article.title)}</span></button>
      <button class="del" data-del="${h.id}" aria-label="删除这篇" title="删除">×</button></li>`).join("");
}
$("hist").addEventListener("click", (ev) => {
  const del = ev.target.closest("[data-del]");
  if (del) {
    const id = del.dataset.del;
    const e = history.find((h) => h.id === id);
    if (!confirm(`删除「${e?.article.title}」？`)) return;
    history = history.filter((h) => h.id !== id);
    batch = batch.filter((b) => b !== id);
    save(LS_HIST, history);
    if (currentId === id) { currentId = null; batch.length ? show(batch[0]) : renderIntro(); }
    renderHistory(); renderTabs();
    return;
  }
  const open = ev.target.closest("[data-id]");
  if (open) show(open.dataset.id);
});

/* ---------------- interactions in the sheet ---------------- */
let pop = null;
function closePop() {
  if (pop) { pop.remove(); pop = null; }
  document.querySelectorAll("mark.w.on").forEach((m) => m.classList.remove("on"));
}
function openPop(mark) {
  closePop();
  const e = history.find((h) => h.id === currentId);
  if (!e) return;
  const key = mark.dataset.w;
  const g = e.article.glossary.find((x) => String(x.word).toLowerCase() === key) || {};
  const given = e.words.find((w) => w.word.toLowerCase() === key) || (e.review || []).find((w) => w.word.toLowerCase() === key);
  const b = bank[key];
  const learnedNote = b && (e.review || []).some((w) => w.word.toLowerCase() === key)
    ? `<div class="given">复习词，${b.learned.slice(5).replace("-", "月")}日学的</div>` : "";
  pop = document.createElement("div");
  pop.className = "pop";
  pop.setAttribute("role", "dialog");
  pop.innerHTML = `<div><span class="hw">${esc(g.word || given?.word || key)}</span><span class="pos">${esc(g.pos || "")}</span></div>
    <div class="mean">${esc(g.meaning || given?.meaning || "（没有释义）")}</div>
    ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}
    ${given?.meaning && given.meaning !== g.meaning ? `<div class="given">你的词书：${esc(given.meaning)}</div>` : ""}${learnedNote}`;
  document.body.append(pop);
  mark.classList.add("on");
  const r = mark.getBoundingClientRect();
  const w = pop.offsetWidth;
  let left = r.left + window.scrollX + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
  pop.style.left = `${left}px`;
  pop.style.top = `${r.bottom + window.scrollY + 8}px`;
}

$("sheet").addEventListener("click", (ev) => {
  const t = ev.target;
  const mark = t.closest("mark.w[data-w]");
  if (mark) { ev.stopPropagation(); mark.classList.contains("on") ? closePop() : openPop(mark); return; }
  if (t.id === "demo") { loadDemo(); return; }
  if (t.closest("#introPick")) { pickPdf(true); return; }
  if (t.id === "openKey") { setDrawer(true); $("settingsBox").open = true; setTimeout(() => $("apiKey").focus(), 80); return; }
  const go = t.closest("[data-go]");
  if (go) { show(go.dataset.go); return; }
  if (t.closest("[data-retry]")) { retryFailed(); return; }
  if (t.id === "copyMd") { copyMarkdown(t); return; }
  if (t.id === "printIt") { window.print(); return; }
  const ropt = t.closest("button[data-r]");
  if (ropt) {
    const e = history.find((h) => h.id === currentId);
    e.readingState = e.readingState || {};
    if (e.readingState[ropt.dataset.r] != null) return;
    e.readingState[ropt.dataset.r] = +ropt.dataset.o;
    save(LS_HIST, history);
    const y = window.scrollY; renderArticle(e); window.scrollTo({ top: y });
    return;
  }
  const opt = t.closest("button[data-q]");
  if (opt) {
    const e = history.find((h) => h.id === currentId);
    e.quizState = e.quizState || {};
    e.quizState[opt.dataset.q] = +opt.dataset.o;
    save(LS_HIST, history);
    // Wrong answer: the correct word goes back to "review tomorrow".
    // Right answer on a review word's question: that word advances to its next interval.
    const qi = +opt.dataset.q;
    const q = e.article.quiz[qi];
    if (q) {
      const rv = (e.review || []).find((w) => reviewQuestionFor(e.article, w.word) === qi + 1);
      // On a review-only article every word is a review word, so its own questions count too.
      const tw = e.reviewOnly ? e.words.find((w) => reviewQuestionFor(e.article, w.word) === qi + 1) : null;
      const word = rv || tw;
      if (+opt.dataset.o !== +q.answer) markMissed(word ? word.word : q.options[+q.answer]);
      else if (word) markRecalled(word.word);
    }
    const y = window.scrollY;
    renderArticle(e);
    window.scrollTo({ top: y });
  }
});
$("sheet").addEventListener("click", (ev) => {
  const c = ev.target.closest("#tZh, #tPlain");
  if (!c) return;
  if (c.id === "tZh") showZh = !showZh; else plain = !plain;
  c.setAttribute("aria-pressed", String(c.id === "tZh" ? showZh : plain));
  $("sheet").className = `sheet${showZh ? "" : " hide-zh"}${plain ? " plain" : ""}`;
});
$("sheet").addEventListener("keydown", (ev) => {
  const mark = ev.target.closest?.("mark.w[data-w]");
  if (mark && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openPop(mark); }
});
document.addEventListener("click", (ev) => { if (pop && !pop.contains(ev.target)) closePop(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closePop(); });
window.addEventListener("resize", closePop);

function copyMarkdown(btn) {
  const e = history.find((h) => h.id === currentId);
  if (!e) return;
  const a = e.article;
  const md = [
    `# ${a.title}`, "",
    ...a.paragraphs.flatMap((p, i) => [p.replace(/\{\{([^{}|]+)\|[^{}]+\}\}/g, "**$1**").replace(/\[\[([^\[\]]+)\]\]/g, "_$1_"), "", ...(a.translation[i] ? [`> ${a.translation[i]}`, ""] : [])]),
    "## 本文单词", "",
    ...a.glossary.map((g) => `- **${g.word}** ${g.pos || ""} ${g.meaning || ""}${g.note ? `（${g.note}）` : ""}`),
    ...((a.phrases || []).length ? ["", "## 作文句式", "", ...a.phrases.map((p) => `- _${p.phrase}_ ${p.meaning || ""}${p.tip ? `（${p.tip}）` : ""}`)] : []),
  ].join("\n");
  const done = () => { btn.textContent = "已复制"; setTimeout(() => (btn.textContent = "复制为 Markdown"), 1500); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(md).then(done, () => fallbackCopy(md, done));
  else fallbackCopy(md, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.append(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch {}
  ta.remove();
}

/* ---------------- demo ---------------- */
function loadDemo() {
  const words = [
    { word: "reluctant", meaning: "adj. 不情愿的" }, { word: "abandon", meaning: "v. 放弃" },
    { word: "fragile", meaning: "adj. 脆弱的" }, { word: "persist", meaning: "v. 坚持" },
    { word: "vivid", meaning: "adj. 生动的" }, { word: "inevitable", meaning: "adj. 不可避免的" },
    { word: "compromise", meaning: "n./v. 妥协" }, { word: "gratitude", meaning: "n. 感激" },
  ];
  const entry = {
    id: "demo-" + Date.now().toString(36),
    batchId: "demo-" + Date.now().toString(36),
    created: new Date().toISOString(),
    words,
    opts: { levelLabel: "四级", genreLabel: "小故事" },
    quizState: {},
    article: {
      title: "The Seedlings on the Balcony",
      paragraphs: [
        "When Lin moved into her first apartment, her grandmother gave her a box of tomato seeds. Lin was {{reluctant|reluctant}} to accept them. She had never kept a plant alive for more than a week, and she worried she would simply {{abandon|abandon}} the project after a few days.",
        "The seedlings that came up were thin and {{fragile|fragile}}. A strong wind could knock them over, and one hot afternoon nearly killed them all. Still, Lin {{persisted|persist}}. Every morning before class she watered them and turned the pots toward the sun.",
        "By July the balcony was full of {{vivid|vivid}} red tomatoes. Some losses were {{inevitable|inevitable}}: birds took a few, and the rain split others. Lin reached a {{compromise|compromise}} with the birds by leaving the lowest branch for them.",
        "When she brought a basket of tomatoes to her grandmother, she felt a deep sense of {{gratitude|gratitude}}. The seeds had taught her something she could not have learned from a textbook.",
      ],
      translation: [
        "林搬进第一套公寓时，奶奶给了她一盒番茄种子。林不太情愿收下。她从来没有让一盆植物活过一周，担心自己几天后就会放弃。",
        "长出来的幼苗又细又脆弱。一阵大风就能把它们吹倒，有一个炎热的下午差点让它们全部死掉。但林坚持了下来。每天上课前她都给它们浇水，并把花盆转向太阳。",
        "到了七月，阳台上挂满了鲜红的番茄。有些损失是不可避免的：鸟吃掉了几个，雨水又裂开了一些。林和鸟达成了妥协，把最低的那根枝条留给它们。",
        "当她把一篮番茄带给奶奶时，心里充满了感激。这些种子教会了她课本上学不到的东西。",
      ],
      glossary: [
        { word: "reluctant", pos: "adj.", meaning: "不情愿的", note: "be reluctant to do sth." },
        { word: "abandon", pos: "v.", meaning: "放弃（计划、事情）", note: "abandon a plan / project" },
        { word: "fragile", pos: "adj.", meaning: "脆弱的，易折断的", note: "" },
        { word: "persist", pos: "v.", meaning: "坚持不懈", note: "persist in doing sth." },
        { word: "vivid", pos: "adj.", meaning: "（颜色）鲜艳的", note: "也常指记忆、描述生动的" },
        { word: "inevitable", pos: "adj.", meaning: "不可避免的", note: "It is inevitable that..." },
        { word: "compromise", pos: "n.", meaning: "折中办法，妥协", note: "reach a compromise with sb." },
        { word: "gratitude", pos: "n.", meaning: "感激之情", note: "a sense of gratitude" },
      ],
      quiz: [
        { question: "Although he was tired, he ____ in practicing the piano every night.", options: ["persisted", "abandoned", "compromised", "reluctant"], answer: 0, explain: "persist in doing sth. 坚持做某事。" },
        { question: "The old glass vase is very ____, so please carry it carefully.", options: ["vivid", "fragile", "inevitable", "reluctant"], answer: 1, explain: "fragile 易碎的，与 carry it carefully 呼应。" },
        { question: "After hours of discussion, the two sides finally reached a ____.", options: ["gratitude", "compromise", "fragile", "persist"], answer: 1, explain: "reach a compromise 达成妥协。" },
        { question: "She still has ____ memories of her first day at school.", options: ["vivid", "reluctant", "inevitable", "fragile"], answer: 0, explain: "vivid memories 清晰生动的记忆。" },
      ],
    },
  };
  history.unshift(entry);
  save(LS_HIST, history);
  batch = [entry.id];
  show(entry.id);
}

/* ---------------- init ---------------- */
restoreSettings();
backfillBank();
updateKeyState();
$("words").value = load(LS_WORDS, "");
updateCount();
renderHistory();
if (history.length) show(history[0].id); else renderIntro();
// Wide screens: drawer docks open by default (remembered). Narrow screens: start closed.
if (wide()) setDrawer(load(LS_DRAWER, true), false);
})();
</script>
